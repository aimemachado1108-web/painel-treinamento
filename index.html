function viewOnboarding(){
  if(!db.onboardingBimestre)db.onboardingBimestre='2025-07';
  const feedbacks=onboardingInBimestre();
  const total=feedbacks.length;
  const keys=bimestreKeys();
  const bSel=keys.map(k=>`<option value="${k}" ${k===db.onboardingBimestre?'selected':''}>${bimestreLabel(k)}</option>`).join('');
  const hasName=db.onboardingBimestre>='2026-07';

  /* cards de resumo */
  function avg(field){
    const vals=feedbacks.map(f=>parseFloat(f[field])).filter(v=>!isNaN(v));
    return vals.length?round(vals.reduce((s,v)=>s+v,0)/vals.length,1):null;
  }
  const avgGeral=avg('geral'),avgClar=avg('clareza'),avgMat=avg('materiais');
  const totPrep=feedbacks.filter(f=>f.preparado==='Sim, totalmente').length;
  const pctPrep=total?Math.round(totPrep/total*100):0;

  /* card por questão */
  function renderCard(q){
    const vals=feedbacks.map(f=>f[q.key]).filter(v=>v&&String(v).trim());
    if(!vals.length)return `<div class="panel" style="opacity:.5"><div class="panel-h"><div class="pi">${q.emoji}</div><h2>${esc(q.label)}</h2></div><div class="empty" style="padding:16px 0">Sem respostas</div></div>`;

    if(q.type==='star5'){
      const nums=vals.map(v=>parseFloat(v)).filter(v=>!isNaN(v));
      if(!nums.length)return '';
      const a=round(nums.reduce((s,v)=>s+v,0)/nums.length,1);
      const dist=[5,4,3,2,1].map(n=>({n,c:nums.filter(v=>Math.round(v)===n).length}));
      const mx=Math.max(...dist.map(d=>d.c),1);
      return `<div class="panel"><div class="panel-h"><div class="pi">${q.emoji}</div><h2>${esc(q.label)}</h2></div>
        <div style="display:flex;align-items:center;gap:24px;margin-bottom:16px">
          <div style="text-align:center;min-width:90px">
            <div style="font-family:'Inter',sans-serif;font-size:3em;font-weight:700;color:var(--gold);line-height:1">${a}</div>
            <div style="color:var(--gold);font-size:1.2em;margin-top:4px">${starStr(a)}</div>
            <div style="font-size:.8em;color:var(--text-3);margin-top:2px">de 5 · ${nums.length} resp.</div>
          </div>
          <div style="flex:1">${dist.map(d=>`<div class="barrow" style="margin-bottom:6px"><div class="nm" style="width:28px;color:var(--gold);font-weight:600;text-align:left">${d.n}★</div><div class="track"><div class="fill" style="width:${d.c/mx*100}%;background:var(--gold)"></div></div><div class="vl" style="width:24px">${d.c}</div></div>`).join('')}</div>
        </div></div>`;
    }

    if(q.type==='choice'){
      const opts=q.options||[...new Set(vals)];
      const counts=opts.map(o=>({o,c:vals.filter(v=>v===o).length}));
      const mx=Math.max(...counts.map(d=>d.c),1);
      const colors=['var(--green)','var(--amber)','var(--red)','var(--blue)','var(--purple)'];
      return `<div class="panel"><div class="panel-h"><div class="pi">${q.emoji}</div><h2>${esc(q.label)}</h2><span style="margin-left:auto;font-size:.8em;color:var(--text-3)">${vals.length} respostas</span></div>
        ${counts.map((d,i)=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <div style="flex:1;font-size:.85em;line-height:1.4;color:var(--text-2)">${esc(d.o)}</div>
          <div class="track" style="width:100px;flex:none"><div class="fill" style="width:${d.c/mx*100}%;background:${colors[i%colors.length]}"></div></div>
          <div style="width:60px;text-align:right;font-size:.85em"><b>${d.c}</b> <span style="color:var(--text-3)">${total?Math.round(d.c/total*100):0}%</span></div>
        </div>`).join('')}</div>`;
    }

    if(q.type==='text'){
      const ne=vals.filter(v=>v.length>2&&!/^(n(ão|ao|enhum)|nada|ok|não sei|sem|\/|-|\.+)$/i.test(v.trim()));
      if(!ne.length)return `<div class="panel"><div class="panel-h"><div class="pi">${q.emoji}</div><h2>${esc(q.label)}</h2></div><div class="empty" style="padding:12px 0">Nenhuma resposta com conteúdo</div></div>`;

        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px">
          ${ne.map(v=>`<div style="background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-size:.88em;color:var(--text-2);line-height:1.55;font-style:italic">"${esc(v)}"</div>`).join('')}
        </div></div>`;
    }
    return '';
  }

  /* tabela de analistas (Jul/2026+) */
  const tabelaAnalistas=hasName&&feedbacks.some(f=>f.nome)?`
    <div class="panel"><div class="panel-h"><div class="pi">👤</div><h2>Respostas por analista</h2></div>
    <div class="wrap-x"><table class="tbl"><thead><tr><th>Analista</th><th>Caixa</th><th>Geral</th><th>Materiais</th><th>Clareza</th><th>Preparado?</th></tr></thead><tbody>
    ${feedbacks.filter(f=>f.nome).map(f=>`<tr><td><b>${esc(f.nome)}</b></td><td>${esc(f.caixa||'—')}</td><td style="color:var(--gold)">${f.geral||'—'} ★</td><td style="color:var(--gold)">${f.materiais||'—'} ★</td><td style="color:var(--gold)">${f.clareza||'—'} ★</td><td>${esc(f.preparado||'—')}</td></tr>`).join('')}
    </tbody></table></div></div>`:'';

  return `<div class="page-h"><h1>${esc(T('onboarding'))} 🎓</h1><p>Avaliações de satisfação dos analistas após o Onboarding B2B — visão semestral.</p></div>

  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap">

    <button class="btn primary sm edit-only" style="margin-left:auto" onclick="openOnboardingImport()">↥ Importar planilha</button>
  </div>

  ${total?`<div class="mcards" style="grid-template-columns:repeat(4,1fr);margin-bottom:24px">
    <div class="mcard"><div class="lbl">Avaliações coletadas</div><div class="val">${total}</div><div class="foot">${bimestreLabel(db.onboardingBimestre)}</div></div>

  </div>`:''}

  ${total?OB_QUESTIONS.map(q=>renderCard(q)).join(''):`<div class="empty">Nenhuma avaliação importada para este período.<br><br><button class="btn primary edit-only" onclick="openOnboardingImport()">↥ Importar planilha de feedback</button></div>`}

  ${tabelaAnalistas}`;
}

function doImportOnboarding(){
  const fileEl=document.getElementById('ob_file');
  if(!fileEl||!fileEl.files||!fileEl.files[0]){toast('Selecione um arquivo');return;}
  const f=fileEl.files[0];
  const isXlsx=/\.xlsx?$/i.test(f.name);
  const r=new FileReader();
  r.onload=function(){
    // Fecha modal DEPOIS de ler o arquivo
    closeModal();
    try{
      let rows;
      if(isXlsx){
        const wb=XLSX.read(r.result,{type:'array',cellDates:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false}).filter(rw=>rw.some(c=>c!==null&&c!==undefined&&String(c).trim()!==''));
      } else {
        rows=parseCSV(r.result,detectDelim(r.result)).filter(rw=>rw.some(c=>c&&c.trim()));
      }
      if(rows.length<2){toast('Arquivo vazio');return;}
      const raw=rows[0].map(h=>String(h||'').trim());
      const low=raw.map(h=>h.toLowerCase().replace(/\s+/g,' ').replace(/\n/g,' '));
      const fi=s=>low.findIndex(h=>h.includes(s));
      const fand=(a,b)=>low.findIndex(h=>h.includes(a)&&h.includes(b));
      const dateI=fi('carimbo');
      const geralI=fand('avaliaria','geral');
      const duracaoI=fand('dura','aprendizado');
      const matI=low.findIndex(h=>h.includes('materiai')||h.includes('ajudaram no aprendizado'));
      const aprofI=fi('aprofund');
      const clarI=low.findIndex(h=>h.includes('clareza')||h.includes('did'));
      const recepI=low.findIndex(h=>h.includes('receptiva')||h.includes('aberta'));
      const avontI=low.findIndex(h=>h.includes('vontade')||h.includes('interagir'));
      const comI=low.findIndex(h=>h.includes('coment')&&(h.includes('forma')||h.includes('sugestão')||h.includes('sugestao')));
      const prepI=fand('preparad','suporte');
      const gostouI=fi('mais gostou');
      const melhI=fand('melhorad','turma');
      const recadoI=low.findIndex(h=>h.includes('recado')||h.includes('mensagem'));
      const nomeI=low.findIndex(h=>h==='nome'||h==='analista'||h==='nome do analista');
      const caixaI=fi('caixa');
      const get=(rw,i)=>i>=0&&rw[i]!=null?String(rw[i]).trim():'';
      const getRaw=(rw,i)=>i>=0?rw[i]:null; // retorna valor original (pode ser Date)
      // Parser de data robusto — aceita MM/DD/YYYY, YYYY-MM-DD, hora com ou sem zero
      function parseDate(s){
        if(!s)return new Date();
        // Se já é objeto Date (xlsx com cellDates:true retorna Date object)
        if(s instanceof Date)return isNaN(s.getTime())?new Date():s;
        s=String(s).trim();
        // Formato MM/DD/YYYY H:MM:SS ou MM/DD/YYYY HH:MM:SS
        const mdy=/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[\s,T]+(\d{1,2}):(\d{2}):(\d{2}))?/;
        const m=s.match(mdy);
        if(m){
          const yyyy=m[3],mm=m[1].padStart(2,'0'),dd=m[2].padStart(2,'0');
          const time=m[4]?`T${m[4].padStart(2,'0')}:${m[5]}:${m[6]}`:'T00:00:00';
          const d=new Date(`${yyyy}-${mm}-${dd}${time}`);
          if(!isNaN(d))return d;
        }
        // Formato ISO ou YYYY-MM-DD
        const d=new Date(s.replace(' ','T'));
        return isNaN(d)?new Date():d;
      }
      const newFb=rows.slice(1).map(rw=>{
        const dateRaw=getRaw(rw,dateI);
        const date=parseDate(dateRaw).toISOString();
        return {date,
          geral:get(rw,geralI),duracao:get(rw,duracaoI),materiais:get(rw,matI),
          aprofundar:get(rw,aprofI),clareza:get(rw,clarI),receptiva:get(rw,recepI),
          avontade:get(rw,avontI),comentario:get(rw,comI),preparado:get(rw,prepI),
          gostou:get(rw,gostouI),melhorar:get(rw,melhI),recado:get(rw,recadoI),
          nome:get(rw,nomeI),caixa:get(rw,caixaI)};
      }).filter(fb=>fb.geral||fb.clareza||fb.materiais||fb.duracao||fb.gostou||fb.recado||fb.preparado);
      if(!newFb.length){toast('Nenhuma resposta válida encontrada');return;}
      const d0=new Date(newFb[0].date);
      const bim=d0.getFullYear()+'-'+(d0.getMonth()<6?'01':'07');
      if(!db.onboardingFeedbacks)db.onboardingFeedbacks=[];
      // Remove TODOS os feedbacks de todos os semestres presentes na planilha importada
      const bimsImportados=new Set(newFb.map(fb=>{const d=new Date(fb.date);return d.getFullYear()+'-'+(d.getMonth()<6?'01':'07');}));
      db.onboardingFeedbacks=db.onboardingFeedbacks.filter(fb=>!bimsImportados.has(new Date(fb.date).getFullYear()+'-'+(new Date(fb.date).getMonth()<6?'01':'07')));
      db.onboardingFeedbacks=db.onboardingFeedbacks.concat(newFb);
      db.onboardingBimestre=bim;
      try{localStorage.setItem('ob_bimestre',bim);}catch(e){}
      try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}
      _lastEdit=Date.now();
      route={page:'onboarding',pdiId:null,teamId:null};
      render();
      pendingSync=true;updateSyncBadge();
      toast('✓ '+newFb.length+' avaliações importadas — '+bimestreLabel(bim));
    }catch(err){toast('Erro: '+err.message);console.error(err);}
  };
  if(isXlsx)r.readAsArrayBuffer(f);else r.readAsText(f,'utf-8');
}

function viewAvaliacaoDetalhe(gi,si){
  const g=db.avaliacaoGrupos[gi];
  const av=toArr(g.semanas)[si];
  const resps=toArr(av.responses||[]);
  const qs=toArr(av.questions||[]);
  const scores=resps.map(r=>parseFloat(r.score)||0);
  const avgScore=scores.reduce((s,v)=>s+v,0)/(scores.length||1);
  const maxScore=Math.max(...scores,0);
  const maxPossible=parseFloat(av.maxPossible)||maxScore||1;
  const pctAcertos=Math.round(avgScore/maxPossible*100);
  const TOPIC_KW=[
    {label:'Leads & Cadastro de empresas',  kw:['cadastr','empresa','pj','credenciado','descredenciado','ativação','ativar','conta nova','nova empresa','lead','cross','aprovad','conta aprova','cadastro de']},
    {label:'Estornos & Chargebacks',        kw:['estorn','chargeback','saldo para estorno','recuperação de chargeback','cb ','disputa','contestação','reembolso']},
    {label:'Antifraude',                    kw:['antifraude','anti-fraude','anti fraude','análise de fraude','reanalise','reanálise','decisão sem','pedido negado','fraude','suspeito']},
    {label:'Conquista Max',                 kw:['conquista','premiação','prêmio','aptidão','entrega de prêmio','conquista max','bonificação']},
    {label:'Reatribuição de chats',         kw:['reatribuição','repassad','quando enviar','integração','retenção','vip saques','transferência de chat','chat para','encaminhar','direcionar','afiliado']},
    {label:'Relatórios',                    kw:['relatório','relatorio','conferencia','conferência','auditoria','auditória','extrato','financeiro','emissão','valores','conciliação']},
    {label:'Taxas',                         kw:['taxa','tpv','processamento','prazo','pix','boleto','cartão','cartao','parcelamento','recebimento','saque']},
  ];
  function detectTopic(q){const ql=q.toLowerCase();for(const t of TOPIC_KW)if(t.kw.some(k=>ql.includes(k)))return t.label;return null;}
  const topicErrors={},topicTotal={};
  qs.forEach((q,qi)=>{
    if(q.type!=='mc')return;
    const topic=detectTopic(q.label);if(!topic)return;
    const ans=resps.map(r=>toArr(r.answers||[])[qi]).filter(a=>a&&a.trim());if(!ans.length)return;
    const counts={};ans.forEach(a=>{counts[a]=(counts[a]||0)+1;});
    const topAns=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
    topicErrors[topic]=(topicErrors[topic]||0)+ans.filter(a=>a!==topAns).length;
    topicTotal[topic]=(topicTotal[topic]||0)+ans.length;
  });
  const topicAll=Object.entries(topicErrors).map(([t,e])=>({t,errPct:Math.round(e/(topicTotal[t]||1)*100),acertoPct:Math.round((1-e/(topicTotal[t]||1))*100)})).filter(x=>topicTotal[x.t]>0);
  const top3Erros=[...topicAll].sort((a,b)=>b.errPct-a.errPct).slice(0,3);
  const top3Acertos=[...topicAll].sort((a,b)=>b.acertoPct-a.acertoPct).slice(0,3);
  while(top3Erros.length<3)top3Erros.push(null);
  while(top3Acertos.length<3)top3Acertos.push(null);
  function topicRow(item,i,isErro){
    if(!item)return`<div style="display:flex;align-items:center;gap:8px;margin-top:8px;opacity:.3"><span style="font-size:.82em;min-width:16px">${i+1}º</span><div style="flex:1;font-size:.85em;color:var(--text-3)">—</div></div>`;
    const pct=isErro?item.errPct:item.acertoPct;const color=isErro?'var(--red-text)':'var(--green-text)';
    return`<div style="display:flex;align-items:center;gap:8px;margin-top:8px"><span style="font-size:.82em;color:${color};font-weight:700;min-width:16px">${i+1}º</span><div style="flex:1;font-size:.85em;color:var(--text-2)">${esc(item.t)}</div><span class="tag" style="background:${isErro?'rgba(239,68,68,.15)':'rgba(34,197,94,.15)'};color:${color}">${pct}%</span></div>`;
  }
  const cards=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px">
    <div class="mcard"><div class="lbl">Analistas avaliadas</div><div class="val">${resps.length}</div></div>
    <div class="mcard"><div class="lbl">% de acertos</div><div class="val" style="color:var(--purple)">${pctAcertos}%</div><div class="foot" style="margin-top:4px">média ${round(avgScore,1)} / ${maxPossible} pts</div></div>
    <div class="mcard"><div class="lbl" style="color:var(--red-text)">🔴 Top 3 erros</div>${top3Erros.map((x,i)=>topicRow(x,i,true)).join('')}</div>
    <div class="mcard"><div class="lbl" style="color:var(--green-text)">🟢 Top 3 acertos</div>${top3Acertos.map((x,i)=>topicRow(x,i,false)).join('')}</div>
  </div>`;
  const ranked=[...resps].sort((a,b)=>(parseFloat(b.score)||0)-(parseFloat(a.score)||0));
  const rankingRows=ranked.map((r,i)=>{
    const pct=maxScore>0?Math.round((parseFloat(r.score)||0)/maxScore*100):0;
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
    const name=r.nome||r.email.split('@')[0].split('.').map(p=>p.charAt(0).toUpperCase()+p.slice(1)).join(' ');
    return`<tr><td style="font-weight:600">${medal} ${i+1}º</td>
      <td><b>${esc(name)}</b>${r.mesAno?` <span style="font-size:.78em;color:var(--text-3)">${esc(r.mesAno)}</span>`:''}<div style="font-size:.78em;color:var(--text-3)">${esc(r.email)}</div></td>
      <td style="font-family:'Inter',sans-serif;font-size:1.1em;font-weight:700;color:var(--gold)">${r.score}</td>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="track" style="width:100px"><div class="fill" style="width:${pct}%;background:var(--gold)"></div></div><span style="font-size:.82em;color:var(--text-3)">${pct}%</span></div></td>
    </tr>`;
  }).join('');
  function getMcStats(qi){const ans=resps.map(r=>toArr(r.answers||[])[qi]).filter(a=>a&&a.trim());const c={};ans.forEach(a=>{c[a]=(c[a]||0)+1;});return Object.entries(c).sort((a,b)=>b[1]-a[1]);}
  const questCards=qs.map((q,qi)=>{
    const answers=resps.map(r=>({name:r.nome||r.email.split('@')[0].split('.').map(p=>p.charAt(0).toUpperCase()+p.slice(1)).join(' '),email:r.email,answer:toArr(r.answers||[])[qi]||''}));
    if(!answers.some(a=>a.answer.trim()))return'';
    if(q.type==='mc'){
      const stats=getMcStats(qi);const total=answers.filter(a=>a.answer.trim()).length;
      return`<div class="panel"><div class="panel-h"><div class="pi">✅</div><h2 style="font-size:.93em;line-height:1.4">${esc(q.label.substring(0,120))}${q.label.length>120?'…':''}</h2></div>
        ${stats.map((s,i)=>{const isTop=i===0;const pct=total?Math.round(s[1]/total*100):0;return`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="font-size:.82em;color:${isTop?'var(--green-text)':'var(--text-3)'};min-width:18px;font-weight:700">${isTop?'✓':''}</span><div style="flex:1;font-size:.85em;color:var(--text-2);line-height:1.3">${esc(s[0])}</div><div class="track" style="width:80px;flex:none"><div class="fill" style="width:${pct}%;background:${isTop?'var(--green)':'var(--border-2)'}"></div></div><div style="width:52px;text-align:right;font-size:.82em"><b>${s[1]}</b>/${total}</div></div>`;}).join('')}
        <details style="margin-top:10px"><summary style="cursor:pointer;font-size:.82em;color:var(--text-3);user-select:none">Ver respostas individuais</summary>
        <div style="margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px">
          ${answers.map(a=>`<div style="background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px"><div style="font-size:.78em;font-weight:600;color:var(--purple);margin-bottom:4px">${esc(a.name)}</div><div style="font-size:.85em;color:var(--text-2)">${esc(a.answer||'—')}</div></div>`).join('')}
        </div></details></div>`;
    }
    const valid=answers.filter(a=>a.answer.trim().length>2);if(!valid.length)return'';
    return`<div class="panel"><div class="panel-h"><div class="pi">✍️</div><h2 style="font-size:.93em;line-height:1.4">${esc(q.label.substring(0,120))}${q.label.length>120?'…':''}</h2><span style="margin-left:auto;font-size:.8em;color:var(--text-3)">${valid.length} resp.</span></div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${valid.map(a=>`<div style="background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px"><div style="font-size:.78em;font-weight:700;color:var(--purple);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em">${esc(a.name)}</div><div style="font-size:.88em;color:var(--text-2);line-height:1.6;white-space:pre-wrap">${esc(a.answer)}</div></div>`).join('')}
      </div></div>`;
  }).join('');
  const semLabel=(si===0?'1ª':'2ª')+' Semana';
  return`<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap">
    <button class="btn" onclick="db._avGrupo=null;db._avSem=null;render()">← Voltar</button>
    <span style="font-weight:700">${esc(g.nome)}</span>
    <span class="tag" style="background:rgba(139,92,246,.15);color:var(--purple)">${semLabel}</span>
    ${av.data?`<span style="font-size:.82em;color:var(--text-3)">${esc(av.data)}</span>`:''}
    <button class="btn sm edit-only" style="margin-left:auto;color:var(--red-text);border-color:var(--red)" onclick="if(confirm('Limpar dados desta semana?')){const s=toArr(db.avaliacaoGrupos[${gi}].semanas);s[${si}]=null;db.avaliacaoGrupos[${gi}].semanas=s;_lastEdit=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}db._avGrupo=null;db._avSem=null;render();pendingSync=true;updateSyncBadge();}">🗑 Limpar semana</button>
  </div>
  ${cards}
  <div class="panel"><div class="panel-h"><div class="pi">🏆</div><h2>Ranking</h2></div>
    <div class="wrap-x"><table class="tbl"><thead><tr><th>#</th><th>Analista</th><th>Pontuação</th><th>Performance</th></tr></thead><tbody>${rankingRows}</tbody></table></div></div>
  <div class="panel-h" style="margin:24px 0 12px"><div class="pi">📝</div><h2>Respostas por questão</h2></div>
  ${questCards}`;
}

    </div>

    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="doImportSemana(${gi},${si})">Importar</button>
    </div>
  </div>`);

function doImportSemana(gi,si){
  const data=((document.getElementById('av_data')||{}).value||'').trim();
  const maxPossible=parseFloat(((document.getElementById('av_max')||{}).value||''))||null;
  const fileEl=document.getElementById('av_file');
  if(!fileEl||!fileEl.files||!fileEl.files[0]){toast('Selecione um arquivo');return;}
  const f=fileEl.files[0];
  const r=new FileReader();
  r.onload=function(){
    closeModal();
    try{
      const wb=XLSX.read(r.result,{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''}).filter(rw=>rw.some(c=>String(c||'').trim()));
      if(rows.length<2){toast('Arquivo vazio');return;}
      const headers=rows[0].map(h=>String(h||'').trim());
      const questions=headers.slice(3).map((h,qi)=>{
        const ans=rows.slice(1).map(rw=>String(rw[qi+3]||'').trim()).filter(a=>a);
        const unique=new Set(ans);const avgLen=ans.reduce((s,a)=>s+a.length,0)/(ans.length||1);
        const firstAns=ans[0]||'';const looksMC=/^[a-d]\)|^(sim|não|yes|no)$/i.test(firstAns.trim());
        return{label:h,type:(unique.size<=Math.max(4,ans.length*0.5)&&avgLen<200&&looksMC)?'mc':'written'};
      });
      const responses=rows.slice(1).map(rw=>{
        const email=String(rw[1]||'').trim();
        const nome=email.split('@')[0].split('.').map(p=>p.charAt(0).toUpperCase()+p.slice(1)).join(' ');
        let mesAno='';try{const raw=rw[0];let d=raw instanceof Date?raw:new Date(String(raw).replace(' ','T'));if(!isNaN(d))mesAno=d.toLocaleDateString('pt-BR',{month:'short',year:'numeric'});}catch(e){}
        return{email,nome,mesAno,score:String(rw[2]||'').trim(),answers:headers.slice(3).map((_,qi)=>String(rw[qi+3]||'').trim())};
      }).filter(r=>r.email);
      if(!responses.length){toast('Nenhuma resposta encontrada');return;}
      if(!db.avaliacaoGrupos[gi].semanas)db.avaliacaoGrupos[gi].semanas=[null,null];
      const semanas=toArr(db.avaliacaoGrupos[gi].semanas);
      semanas[si]={questions,responses,maxPossible,data,importedAt:new Date().toISOString()};
      db.avaliacaoGrupos[gi].semanas=semanas;
      db._avGrupo=gi;db._avSem=si;
      _lastEdit=Date.now();
      try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}
      render();pendingSync=true;updateSyncBadge();
      toast('✓ '+responses.length+' analista'+(responses.length!==1?'s':'')+' importadas');
    }catch(err){toast('Erro: '+err.message);console.error(err);}
  };
  r.readAsArrayBuffer(f);
}

/* ===================== ACOMPANHAMENTO SEMANAL ===================== */
const CAIXAS_ONB=['Silver','Vip/Saques','Integração'];
function getMetas(caixa){
  const isSilver=(caixa||'Silver')==='Silver';
  return{sla:isSilver?5:3, csat:isSilver?94:97, tma:24};
}
function corSLA(v,cx){if(v===null||v===undefined)return'var(--text)';return v<=getMetas(cx).sla?'var(--green)':'var(--red-text)';}
function corCSAT(v,cx){if(v===null||v===undefined)return'var(--text)';return v>=getMetas(cx).csat?'var(--green)':'var(--red-text)';}
function corTMA(v){if(v===null||v===undefined)return'var(--text)';return v<=24?'var(--green)':'var(--red-text)';}

function viewAcompanhamento(){
  const _mesesFiltro=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  
  const lista=(db.acompanhamento||[]).filter(a=>{
    // Prioridade 1: campo month (mais confiável)
    if(a.month)return a.month===db.current;
    
    // Prioridade 2: extrair do periodo1 (formato dd/mm/aaaa)
    if(a.periodo1){
      const m=a.periodo1.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if(m){
        const acompMes=_mesesFiltro[parseInt(m[2])-1]+' '+m[3];
        return acompMes===db.current;
      }
    }
    
    // Se não tem month nem periodo1, não mostra (era o antigo Yuri sem período)
    return false;
  });
  
  const addBtn=`<div class="edit-only-block" style="margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" onclick="openAddAnalista()">+ Adicionar analista</button><button class="btn primary sm" onclick="openImportAvaliacaoOnboarding()">+ Importar avaliação</button></div>`;
  if(!lista.length)return addBtn+`<div class="empty">Nenhuma analista cadastrada.<br>Adicione para registrar a evolução semanal de atendimento.</div>`;

  const cards=lista.map((a,ai)=>{
    // Garantir array mesmo se Firebase retornou objeto
    const rawSem=a.semanas||[];
    const semanas=[0,1,2].map(si=>({
      d: Array.isArray(rawSem)?rawSem[si]:(rawSem[si]??rawSem[String(si)]??null),
      periodo: a['periodo'+(si+1)]||''
    }));
    const csats=semanas.map(s=>s.d?.csat??null).filter(v=>v!==null);
    const sparkW=90,sparkH=32;
    const pts=csats.map((n,i)=>`${Math.round(i/(Math.max(csats.length-1,1))*(sparkW-12)+6)},${Math.round(sparkH-4-((n/100)*(sparkH-8)))}`);
    const spark=csats.length>=2?`<svg width="${sparkW}" height="${sparkH}" style="overflow:visible"><polyline points="${pts.join(' ')}" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${csats.map((n,i)=>`<circle cx="${pts[i].split(',')[0]}" cy="${pts[i].split(',')[1]}" r="2.5" fill="var(--purple)"/>`).join('')}</svg>`:'';
    const tend=csats.length>=2?(csats[csats.length-1]>=csats[0]?'↑':'↓'):'';
    const tendC=csats.length>=2?(csats[csats.length-1]>=csats[0]?'var(--green)':'var(--red-text)'):'';
    const metas=getMetas(a.caixa);
    const acompId=a.id||`acomp_${Date.now()}_${ai}`;
    // Atualizar no banco se não tem ID
    if(!a.id){a.id=acompId;}
    const prova=a.prova||null;
    const provaTotal=(prova&&prova.ac!=null&&prova.er!=null)?prova.ac+prova.er:null;
    const provaPct=provaTotal?Math.round(prova.ac/provaTotal*100):null;
    const provaBadge=prova?`<span class="tag" style="cursor:pointer;background:${provaPct!=null&&provaPct>=60?'rgba(16,185,129,.15)':'rgba(239,68,68,.15)'};color:${provaPct!=null&&provaPct>=60?'var(--green-text)':'var(--red-text)'}" onclick="openProvaDetalheOnboarding('${acompId}')" title="Ver questões erradas">📊 prova ${provaPct!=null?provaPct+'%':'—'}</span>`:'';

    return `<div class="panel" style="padding:18px 20px;margin-bottom:12px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px">
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
            <span style="font-weight:700;font-size:1em">${esc(a.nome)}</span>
            ${a.caixa?`<span class="tag" style="background:rgba(139,92,246,.15);color:var(--purple)">${esc(a.caixa)}</span>`:''}
            ${provaBadge}
          </div>
          <div style="font-size:.8em;color:var(--text-3)">${esc(a.email||'')}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          ${spark}
          ${tend?`<span style="font-size:1.2em;color:${tendC};font-weight:700">${tend}</span>`:''}
          <button class="btn sm edit-only" style="color:var(--red-text);border-color:var(--red)" onclick="deletarAnalistaById('${acompId}')">✕</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
        ${semanas.map((sem,si)=>{
          const s=sem.d;
          const prev=si>0?semanas[si-1].d:null;
          const filled=s&&(s.sla!==null||s.csat!==null||s.recebidas!==null||s.fechadas!==null||s.tma!==null);

          // Delta vs semana anterior
          function delta(curr,prevV,maiorMelhor){
            if(curr==null||prevV==null||curr===''||prevV==='')return'';
            const d=parseFloat(curr)-parseFloat(prevV);
            if(d===0)return'<span style="font-size:.7em;color:var(--text-3)">= sem variação</span>';
            const melhorou=maiorMelhor?d>0:d<0;
            const sinal=d>0?'+':'';
            return`<span style="font-size:.7em;color:${melhorou?'var(--green)':'var(--red-text)'};font-weight:600">${sinal}${d.toFixed(1)} ${melhorou?'↑':'↓'} vs S${si}</span>`;
          }

          return `<div style="background:var(--input-bg);border:1px solid var(--border);border-radius:10px;overflow:hidden">
            <div style="padding:10px 12px 6px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)">
              <div>
                <div style="font-weight:700;font-size:.85em">Semana ${si+1}</div>
                ${sem.periodo?`<div style="font-size:.72em;color:var(--purple);margin-top:1px">${esc(sem.periodo)}</div>`:`<div style="font-size:.72em;color:var(--text-3);margin-top:1px">sem período</div>`}
              </div>
              <button class="btn sm" style="padding:3px 8px;font-size:.78em" onclick="openEditSemanaById('${acompId}',${si})" title="Registrar semana ${si+1}">✎</button>
            </div>
            <div style="padding:10px 12px">
              ${filled?`
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 10px">
                <div>
                  <div style="font-size:.62em;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:1px">SLA ≤${metas.sla}min</div>
                  <div style="font-size:1.05em;font-weight:700;font-family:'Inter',sans-serif;color:${corSLA(s.sla,a.caixa)}">${s.sla!=null?s.sla+'min':'—'}</div>
                  ${prev?delta(s.sla,prev.sla,false):''}
                </div>
                <div>
                  <div style="font-size:.62em;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:1px">CSAT ≥${metas.csat}%</div>
                  <div style="font-size:1.05em;font-weight:700;font-family:'Inter',sans-serif;color:${corCSAT(s.csat,a.caixa)}">${s.csat!=null?s.csat+'%':'—'}</div>
                  ${prev?delta(s.csat,prev.csat,true):''}
                </div>
                <div>
                  <div style="font-size:.62em;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:1px">Recebidas</div>
                  <div style="font-size:1.05em;font-weight:600">${s.recebidas??'—'}</div>
                </div>
                <div>
                  <div style="font-size:.62em;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:1px">Fechadas</div>
                  <div style="font-size:1.05em;font-weight:600">${s.fechadas??'—'}</div>
                </div>
                <div>
                  <div style="font-size:.62em;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:1px">TMA ≤24h</div>
                  <div style="font-size:1.05em;font-weight:700;font-family:'Inter',sans-serif;color:${corTMA(s.tma)}">${s.tma!=null?s.tma+'h':'—'}</div>
                  ${prev?delta(s.tma,prev.tma,false):''}
                </div>
                <div>
                  <div style="font-size:.62em;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:1px">Produtividade</div>
                  <div style="font-size:1.05em;font-weight:700;font-family:'Inter',sans-serif;color:var(--blue)">${s.recebidas&&s.fechadas!=null?Math.round(s.fechadas/s.recebidas*100)+'%':'—'}</div>
                  <div style="font-size:.75em;color:var(--text-3)">${s.fechadas??'—'}/${s.recebidas??'—'}</div>
                </div>
                ${s.obs?`<div style="grid-column:span 2;border-top:1px solid var(--border);padding-top:6px;margin-top:2px;font-size:.75em;color:var(--text-3);line-height:1.4">${esc(s.obs)}</div>`:''}
              </div>`
              :`<div style="font-size:.82em;color:var(--text-3);padding:4px 0 6px">Sem registros</div>`}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
  
  // ========== CARD DE EVOLUÇÃO (após S2 preenchida) ==========
  let evolCard='';
  
  // Filtro por analista
  const todosAnalistas=lista.map(a=>a.nome);
  let filterAnalista=db._onbEvolFilter||'Consolidado';
  let analListaFiltrada=filterAnalista==='Consolidado'?lista:lista.filter(a=>a.nome===filterAnalista);
  
  const filterHTML=todosAnalistas.length>1?`<div class="filters" style="margin-bottom:14px"><span style="font-size:.85em;color:var(--text-3);align-self:center">Analista:</span>${['Consolidado',...todosAnalistas].map(n=>`<button class="ft ${filterAnalista===n?'on':''}" onclick="db._onbEvolFilter='${n}';render()">${esc(n)}</button>`).join('')}</div>`:'';
  
  // Selecionar semanas para comparação
  const semUpTo2=analListaFiltrada.some(a=>{
    const rawSem=a.semanas||[];
    const s2=Array.isArray(rawSem)?rawSem[1]:(rawSem[1]??rawSem['1']??null);
    return s2&&(s2.sla!==null||s2.csat!==null||s2.tma!==null||s2.recebidas!==null||s2.fechadas!==null);
  });
  const semUpTo3=analListaFiltrada.some(a=>{
    const rawSem=a.semanas||[];
    const s3=Array.isArray(rawSem)?rawSem[2]:(rawSem[2]??rawSem['2']??null);
    return s3&&(s3.sla!==null||s3.csat!==null||s3.tma!==null||s3.recebidas!==null||s3.fechadas!==null);
  });
  
  // Determinar qual semana mostrar (prioridade: S3 > S2)
  let showMode='none';
  if(semUpTo3){
    showMode='s1s3';
  }else if(semUpTo2){
    showMode='s1s2';
  }
  
  const compareMode=showMode;
  const s1Idx=0, s2Idx=1, s3Idx=2;
  const compareToIdx=compareMode==='s1s3'?s3Idx:s2Idx;
  
  if(analListaFiltrada.length>0){
    // Cálculo: Média (S1+S2) vs S3
    const calcEvol=(arr,chave)=>{
      const vals=arr.map(a=>{
        const rawSem=a.semanas||[];
        const s1=Array.isArray(rawSem)?rawSem[0]:(rawSem[0]??rawSem['0']??null);
        const s2=Array.isArray(rawSem)?rawSem[1]:(rawSem[1]??rawSem['1']??null);
        const s3=Array.isArray(rawSem)?rawSem[2]:(rawSem[2]??rawSem['2']??null);
        
        if(!s1||!s2||!s3)return null;
        
        if(chave==='sla'){
          if(s1.sla!=null&&s1.sla!==''&&s2.sla!=null&&s2.sla!==''&&s3.sla!=null&&s3.sla!==''){
            const s1Val=parseFloat(s1.sla);
            const s2Val=parseFloat(s2.sla);
            const s3Val=parseFloat(s3.sla);
            const media=(s1Val+s2Val)/2;
            if(media>0)return((media-s3Val)/media)*100;
          }
        }
        if(chave==='csat'){
          if(s1.csat!=null&&s1.csat!==''&&s2.csat!=null&&s2.csat!==''&&s3.csat!=null&&s3.csat!==''){
            const s1Val=parseFloat(s1.csat);
            const s2Val=parseFloat(s2.csat);
            const s3Val=parseFloat(s3.csat);
            const media=(s1Val+s2Val)/2;
            if(media>0)return((s3Val-media)/media)*100;
          }
        }
        if(chave==='tma'){
          if(s1.tma!=null&&s1.tma!==''&&s2.tma!=null&&s2.tma!==''&&s3.tma!=null&&s3.tma!==''){
            const s1Val=parseFloat(s1.tma);
            const s2Val=parseFloat(s2.tma);
            const s3Val=parseFloat(s3.tma);
            const media=(s1Val+s2Val)/2;
            if(media>0)return((media-s3Val)/media)*100;
          }
        }
        if(chave==='recebidas'){
          if(s1.recebidas!=null&&s1.recebidas!==''&&s2.recebidas!=null&&s2.recebidas!==''&&s3.recebidas!=null&&s3.recebidas!==''){
            const s1Val=parseFloat(s1.recebidas);
            const s2Val=parseFloat(s2.recebidas);
            const s3Val=parseFloat(s3.recebidas);
            const media=(s1Val+s2Val)/2;
            if(media>0)return((s3Val-media)/media)*100;
          }
        }
        if(chave==='fechadas'){
          if(s1.fechadas!=null&&s1.fechadas!==''&&s2.fechadas!=null&&s2.fechadas!==''&&s3.fechadas!=null&&s3.fechadas!==''){
            const s1Val=parseFloat(s1.fechadas);
            const s2Val=parseFloat(s2.fechadas);
            const s3Val=parseFloat(s3.fechadas);
            const media=(s1Val+s2Val)/2;
            if(media>0)return((s3Val-media)/media)*100;
          }
        }
        return null;
      }).filter(v=>v!==null);
      
      return vals.length?Math.round(vals.reduce((s,v)=>s+v,0)/vals.length*10)/10:null;
    };
    
    const avgSla=calcEvol(analListaFiltrada,'sla');
    const avgCsat=calcEvol(analListaFiltrada,'csat');
    const avgTma=calcEvol(analListaFiltrada,'tma');
    const avgRecebidas=calcEvol(analListaFiltrada,'recebidas');
    const avgFechadas=calcEvol(analListaFiltrada,'fechadas');
    
    const mkCard=(label,val)=>{
      if(val===null)return '';
      const melhorou=val>0;
      const sinal=val>0?'+':'';
      return `<div style="background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:14px 16px">
        <div style="font-size:10px;letter-spacing:.05em;text-transform:uppercase;opacity:.85;color:#fff">${label}</div>
        <div style="font-family:'Inter',sans-serif;font-size:1.9em;font-weight:700;margin-top:6px;letter-spacing:-.5px;color:#fff">${sinal}${val}%</div>
        <div style="font-size:.78em;opacity:.8;margin-top:2px;color:#fff">${melhorou?'↑ melhora':'↓ queda'}</div>
      </div>`;
    };
    
    const cards=[];
    if(avgSla!==null) cards.push(mkCard('SLA 1ª RESP / MÉDIA (MIN)',avgSla));
    if(avgCsat!==null) cards.push(mkCard('CSAT / SEMANAL',avgCsat));
    if(avgTma!==null) cards.push(mkCard('TMA / MÉDIA (H)',avgTma));
    if(avgRecebidas!==null) cards.push(mkCard('CHATS RECEBIDOS',avgRecebidas));
    if(avgFechadas!==null) cards.push(mkCard('CHATS FECHADOS',avgFechadas));
    
    if(cards.length>0){
      const semLabel=compareMode==='s1s3'?'S1 → S3':'S1 → S2';
      evolCard=`${filterHTML}<div style="background:linear-gradient(120deg,#6d5de0,#5848c4);color:#fff;border-radius:var(--radius);padding:20px 22px;margin-bottom:18px">
        <div style="font-family:'Inter',sans-serif;font-size:1.25em;font-weight:700;color:#fff;margin-bottom:14px">Evolução ${semLabel} — ${db.current} ✦</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px">
          ${cards.join('')}
        </div>
      </div>`;
    }
  }
  
  return addBtn+(compareMode!=='none'?evolCard:'')+cards;
}

function importOnboardingAvaliacao(){
  const f=document.getElementById('obAvalFile').files[0];if(!f){toast('Selecione um arquivo');return;}
  readSheetRows(f,(err,rows)=>{
    if(err){toast('Erro ao ler o arquivo: '+err.message);console.error(err);return;}
    if(!rows||rows.length<2){toast('Arquivo vazio ou sem respostas');return;}
    try{
      const parsed=parseAnswerSheet(rows);
      if(!parsed.results.length){toast('Nenhuma linha de resposta válida encontrada');return;}
      let matched=0;const naoEncontrados=[];
      parsed.results.forEach(res=>{
        const ex=(db.acompanhamento||[]).find(a=>(res.email&&a.email&&a.email.toLowerCase().trim()===res.email.toLowerCase().trim())||nkey(a.nome)===nkey(res.analista));
        if(ex){
          ex.prova={ac:res.ac,er:res.er,answers:res.answers,stars:res.stars,feedback:res.feedback,importedAt:new Date().toISOString()};
          ex.provaQuestions=parsed.questions;
          matched++;
        } else {
          naoEncontrados.push(res.analista);
        }
      });
      closeModal();persist();render();
      toast(matched+' analista(s) atualizado(s)'+(naoEncontrados.length?' · '+naoEncontrados.length+' não encontrada(s): '+naoEncontrados.slice(0,3).join(', '):''));
    }catch(err){toast('Erro ao processar o arquivo: '+err.message);console.error(err);}
  });
}

  const fechadas=g('sem_fech')!==''?parseInt(g('sem_fech')):null;
  const tma=g('sem_tma')!==''?parseFloat(g('sem_tma')):null;
  const obs=g('sem_obs');const periodo=g('sem_periodo');
  const rawSem=db.acompanhamento[ai].semanas||[];
  const semArr=Array.isArray(rawSem)?[...rawSem]:[0,1,2].map(i=>rawSem[i]??rawSem[String(i)]??null);
  while(semArr.length<3)semArr.push(null);
  semArr[si]={sla,csat,avaliacoes,recebidas,fechadas,tma,obs};
  db.acompanhamento[ai].semanas=semArr;
  if(periodo)db.acompanhamento[ai]['periodo'+(si+1)]=periodo;

}

function initAvalConhecimento(){
  // Garantir array
  if(!db.avalConhecimentos)db.avalConhecimentos=[];
  if(!Array.isArray(db.avalConhecimentos)){
    try{db.avalConhecimentos=Object.values(db.avalConhecimentos);}catch(e){db.avalConhecimentos=[];}
  }
  // Normalizar analistas de objeto para array em todas as entradas (Firebase converte)
  db.avalConhecimentos.forEach(a=>{
    if(a&&a.analistas&&!Array.isArray(a.analistas))a.analistas=Object.values(a.analistas);
    if(a&&a.analistas)a.analistas.forEach(an=>{
      if(an.detalhes&&!Array.isArray(an.detalhes))an.detalhes=Object.values(an.detalhes);
      if(an.secoes_relevantes&&!Array.isArray(an.secoes_relevantes))an.secoes_relevantes=Object.values(an.secoes_relevantes);
    });
  });
  // Remover qualquer versão de Julho/2026 que veio do Firebase (pode estar corrompida)
  db.avalConhecimentos=db.avalConhecimentos.filter(a=>a&&a.month!=='Julho 2026'&&a.id!=='ac_jul2026');
  // SEMPRE reconstruir Julho/2026 dos dados embutidos no código
  const an=_AVAL_DATA.map(r=>{
    const det=(r.det||[]).map(d=>({secao:d.s==='SG'?'Suporte Geral':d.s==='PS'?'Processos Saques':'Suporte Integração',topico:d.t,acertou:d.a}));
    return{nome:r.n,caixa:r.cx,ta_g:r.g,tq_g:30,pct_g:r.pg,ta_r:r.r,tq_r:r.tr,pct_r:r.pr,
      secoes_relevantes:r.rel,
      secoes:{'Suporte Geral':{pct:r.sg,dificuldade:r.dg},'Processos Saques':{pct:r.ps,dificuldade:r.ds},'Suporte Integração':{pct:r.si,dificuldade:r.di}},
      detalhes:det};
  });
  db.avalConhecimentos.unshift({id:'ac_jul2026',data:'Julho/2026',month:'Julho 2026',analistas:an});
}

  const avgG=Math.round(an.reduce((s,a)=>s+a.pct_g,0)/an.length);
  function avgSec(sn){return Math.round(an.reduce((s,a)=>s+(a.secoes[sn]||{pct:0}).pct,0)/an.length);}
  function avgDif(sn){const v=an.map(a=>parseFloat((a.secoes[sn]||{}).dificuldade)).filter(d=>!isNaN(d));return v.length?round(v.reduce((s,x)=>s+x,0)/v.length,1):null;}

  function topList(sn,limit,isErro){
    const te={},tt={};
    an.forEach(a=>(a.detalhes||[]).forEach(d=>{
      if(d.secao===sn){te[d.topico]=(te[d.topico]||0)+(isErro?(d.acertou?0:1):(d.acertou?1:0));tt[d.topico]=(tt[d.topico]||0)+1;}
    }));
    return Object.entries(te).map(([t,v])=>({t,pct:Math.round(v/(tt[t]||1)*100)})).sort((a,b)=>b.pct-a.pct).slice(0,limit);
  }
  function renderItems(items,isErro){
    if(!items.length)return'<div style="font-size:.82em;color:var(--text-3);padding:6px 0">—</div>';
    const cor=isErro?'var(--red-text)':'var(--green-text)';
    const bg=isErro?'rgba(239,68,68,.12)':'rgba(34,197,94,.12)';
    return items.map((e,i)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px"><span style="font-size:.82em;color:${cor};font-weight:700;min-width:18px">${i+1}º</span><div style="flex:1;font-size:.88em;color:var(--text-2)">${esc(e.t)}</div><span class="tag" style="background:${bg};color:${cor}">${e.pct}%</span></div>`).join('');
  }

  // Cards resumo
  const cards=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
    <div class="mcard"><div class="lbl">Média geral</div><div class="val" style="color:${avgG>=60?'var(--green)':'var(--red-text)'}">${avgG}%</div><div class="foot">${an.length} analistas · 30 questões</div></div>
    <div class="mcard"><div class="lbl">Suporte Geral</div><div class="val" style="color:${avgSec('Suporte Geral')>=60?'var(--green)':'var(--red-text)'}">${avgSec('Suporte Geral')}%</div>${avgDif('Suporte Geral')?`<div class="foot">Dificuldade: ${avgDif('Suporte Geral')}/5</div>`:''}</div>
    <div class="mcard"><div class="lbl">Processos Saques</div><div class="val" style="color:${avgSec('Processos Saques')>=60?'var(--green)':'var(--red-text)'}">${avgSec('Processos Saques')}%</div>${avgDif('Processos Saques')?`<div class="foot">Dificuldade: ${avgDif('Processos Saques')}/5</div>`:''}</div>
    <div class="mcard"><div class="lbl">Suporte Integração</div><div class="val" style="color:${avgSec('Suporte Integração')>=60?'var(--green)':'var(--red-text)'}">${avgSec('Suporte Integração')}%</div>${avgDif('Suporte Integração')?`<div class="foot">Dificuldade: ${avgDif('Suporte Integração')}/5</div>`:''}</div>
  </div>`;

  // Erros e acertos
  const errosAcertos=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px">
    <div class="panel" style="padding:16px 18px">
      <div style="font-weight:700;font-size:.92em;color:var(--red-text);margin-bottom:14px">🔴 Top erros por seção</div>
      <div style="font-size:.78em;color:var(--text-3);font-weight:600;margin-bottom:8px;text-transform:uppercase">Suporte Geral (Top 5)</div>
      ${renderItems(topList('Suporte Geral',5,true),true)}
      <div style="font-size:.78em;color:var(--text-3);font-weight:600;margin:12px 0 8px;text-transform:uppercase">Processos Saques (Top 2)</div>
      ${renderItems(topList('Processos Saques',2,true),true)}
      <div style="font-size:.78em;color:var(--text-3);font-weight:600;margin:12px 0 8px;text-transform:uppercase">Suporte Integração (Top 2)</div>
      ${renderItems(topList('Suporte Integração',2,true),true)}
    </div>
    <div class="panel" style="padding:16px 18px">
      <div style="font-weight:700;font-size:.92em;color:var(--green-text);margin-bottom:14px">🟢 Top acertos por seção</div>
      <div style="font-size:.78em;color:var(--text-3);font-weight:600;margin-bottom:8px;text-transform:uppercase">Suporte Geral (Top 5)</div>
      ${renderItems(topList('Suporte Geral',5,false),false)}
      <div style="font-size:.78em;color:var(--text-3);font-weight:600;margin:12px 0 8px;text-transform:uppercase">Processos Saques (Top 2)</div>
      ${renderItems(topList('Processos Saques',2,false),false)}
      <div style="font-size:.78em;color:var(--text-3);font-weight:600;margin:12px 0 8px;text-transform:uppercase">Suporte Integração (Top 2)</div>
      ${renderItems(topList('Suporte Integração',2,false),false)}
    </div>
  </div>`;

  // Top 5 geral
  const rg=[...an].sort((a,b)=>b.pct_g-a.pct_g).slice(0,5);
  const top5HTML=`<div class="panel" style="margin-bottom:20px"><div class="panel-h"><div class="pi">🏆</div><h2>Top 5 — Ranking Geral</h2></div>
    <div class="wrap-x"><table class="tbl"><thead><tr><th>#</th><th>Analista</th><th>Caixa</th><th>%</th><th>Acertos</th><th>S.Geral</th><th>Saques</th><th>Integração</th></tr></thead><tbody>
    ${rg.map((r,i)=>{const m=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';return`<tr>
      <td style="font-weight:600">${m} ${i+1}º</td>
      <td><b>${esc(r.nome)}</b></td>
      <td style="font-size:.82em;color:var(--text-3)">${esc(r.caixa)}</td>
      <td style="font-family:'Inter',sans-serif;font-weight:700;color:${r.pct_g>=60?'var(--green)':'var(--red-text)'}">${r.pct_g}%</td>
      <td>${r.ta_g}/30</td>
      <td style="color:${(r.secoes['Suporte Geral']||{}).pct>=60?'var(--green)':'var(--red-text)'}">${(r.secoes['Suporte Geral']||{}).pct||0}%</td>
      <td style="color:${(r.secoes['Processos Saques']||{}).pct>=60?'var(--green)':'var(--red-text)'}">${(r.secoes['Processos Saques']||{}).pct||0}%</td>
      <td style="color:${(r.secoes['Suporte Integração']||{}).pct>=60?'var(--green)':'var(--red-text)'}">${(r.secoes['Suporte Integração']||{}).pct||0}%</td>
    </tr>`;}).join('')}
    </tbody></table></div></div>`;

  // Melhor por frente
  const frentes={};
  an.forEach(a=>{const cx=(a.caixa||'Outros').split('(')[0].trim();if(!frentes[cx])frentes[cx]=[];frentes[cx].push(a);});

  const frentesHTML=Object.entries(frentes).map(([cx,membros])=>{
    const rel=membros[0].secoes_relevantes||['Suporte Geral','Processos Saques','Suporte Integração'];
    const rf=[...membros].sort((a,b)=>b.pct_r-a.pct_r);
    const best=rf[0];
    const secH=rel.map(sn=>`<th>${sn.replace('Suporte ','S.').replace('Processos ','P.')}</th>`).join('');
    const rows=rf.map((r,i)=>{
      const secC=rel.map(sn=>{const p=(r.secoes[sn]||{}).pct||0;return`<td style="color:${p>=60?'var(--green)':'var(--red-text)'}">${p}%</td>`;}).join('');
      return`<tr><td style="font-weight:600">${i===0?'🥇 ':''} ${i+1}º</td><td><b>${esc(r.nome)}</b></td><td style="font-weight:700;color:${r.pct_r>=60?'var(--green)':'var(--red-text)'}">${r.pct_r}%</td><td>${r.ta_r}/${r.tq_r}</td>${secC}</tr>`;
    }).join('');

    // Erros e fortalezas da frente — cada analista só contribui nas SUAS seções relevantes
    const fErros=[],fAcertos=[];
    const allSecs=new Set();rel.forEach(s=>allSecs.add(s));
    membros.forEach(a=>{
      const mRel=a.secoes_relevantes||rel;
      (a.detalhes||[]).forEach(d=>{
        if(!mRel.includes(d.secao))return;
        if(!fErros._te)fErros._te={};if(!fErros._tt)fErros._tt={};if(!fAcertos._ta)fAcertos._ta={};
        fErros._te[d.topico]=(fErros._te[d.topico]||0)+(d.acertou?0:1);
        fErros._tt[d.topico]=(fErros._tt[d.topico]||0)+1;
        fAcertos._ta[d.topico]=(fAcertos._ta[d.topico]||0)+(d.acertou?1:0);
      });
    });
    const fErrosList=Object.entries(fErros._te||{}).map(([t,e])=>({t,pct:Math.round(e/((fErros._tt||{})[t]||1)*100)})).sort((a,b)=>b.pct-a.pct);
    const fAcertosList=Object.entries(fAcertos._ta||{}).map(([t,a])=>({t,pct:Math.round(a/((fErros._tt||{})[t]||1)*100)})).sort((a,b)=>b.pct-a.pct);

    return`<div class="panel" style="margin-bottom:16px"><div class="panel-h"><div class="pi">📁</div><h2>${esc(cx)}</h2><span style="margin-left:auto;font-size:.78em;color:var(--text-3)">${rel.join(' · ')}</span></div>
      <div class="wrap-x"><table class="tbl"><thead><tr><th>#</th><th>Analista</th><th>%</th><th>Acertos</th>${secH}</tr></thead><tbody>${rows}</tbody></table></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
        <div><div style="font-size:.8em;font-weight:700;color:var(--red-text);margin-bottom:6px">🔴 Erros da frente</div>${fErrosList.slice(0,3).map((e,i)=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:.82em"><span style="color:var(--red-text);font-weight:700">${i+1}º</span> ${esc(e.t)} <span class="tag" style="background:rgba(239,68,68,.12);color:var(--red-text);font-size:.7em">${e.pct}%</span></div>`).join('')||'<div style="font-size:.82em;color:var(--text-3)">—</div>'}</div>
        <div><div style="font-size:.8em;font-weight:700;color:var(--green-text);margin-bottom:6px">🟢 Fortalezas</div>${fAcertosList.slice(0,3).map((e,i)=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:.82em"><span style="color:var(--green-text);font-weight:700">${i+1}º</span> ${esc(e.t)} <span class="tag" style="background:rgba(34,197,94,.12);color:var(--green-text);font-size:.7em">${e.pct}%</span></div>`).join('')||'<div style="font-size:.82em;color:var(--text-3)">—</div>'}</div>
      </div>
    </div>`;
  }).join('');

  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap">
    <button class="btn" onclick="route.teamId=null;render()">← Voltar</button>
    <span style="font-weight:700;font-size:1.1em">📊 Avaliação de Conhecimento</span>
    <span style="font-size:.82em;color:var(--text-3)">${esc(ac.data||'Julho/2026')}</span>
    <button class="btn sm edit-only" style="margin-left:auto" onclick="editAvalConhecimento(route.teamId)">✎ Editar</button>
    <button class="btn sm edit-only" style="color:var(--red-text);border-color:var(--red)" onclick="deleteAvalConhecimento(route.teamId)">🗑</button>
  </div>
  ${cards}${errosAcertos}${top5HTML}
  <div class="panel-h" style="margin:20px 0 12px"><div class="pi">📁</div><h2>Melhor por frente de atendimento</h2></div>
  ${frentesHTML}`;
}

function isAcertoSymbol(v){
  const raw=(v||'').toString().trim();
  const sl=raw.toLowerCase();
  const ok=['✓','✔','✅','v','c','certo','correto','correta','acerto','acertou','1','sim','true','ok'];
  const nok=['✗','✘','✕','❌','x','e','erro','errou','errado','errada','incorreto','0','nao','não','false'];
  if(ok.includes(raw)||ok.includes(sl))return true;
  if(nok.includes(raw)||nok.includes(sl))return false;
  return null;
}

function doImportNewAC(){
  const nome=((document.getElementById('aci_nome')||{}).value||'').trim()||'Avaliação de Conhecimento';
  const data=((document.getElementById('aci_data')||{}).value||'').trim();
  const month=((document.getElementById('aci_month')||{}).value||'').trim()||db.current;
  const fileEl=document.getElementById('aci_file');
  if(!fileEl||!fileEl.files[0]){toast('Selecione um arquivo');return;}
  const rd=new FileReader();
  rd.onload=function(){
    closeModal();
    try{
      const wb=XLSX.read(rd.result,{type:'array'});
      let analistas=[];

      // FORMATO 1: Planilha FINAL com aba "Ranking Geral"
      if(wb.Sheets['Ranking Geral']){
        const wsR=wb.Sheets['Ranking Geral'];
        const rRows=XLSX.utils.sheet_to_json(wsR,{header:1,defval:''});
        analistas=rRows.slice(1).filter(rw=>String(rw[1]||'').trim()&&!isNaN(parseInt(rw[3]))).map(rw=>{
          const nm=String(rw[1]).trim(),cx=String(rw[2]||'').trim();
          const ta_g=parseInt(rw[3])||0;
          const pct_g=Math.round(ta_g/30*100); // recalculado a partir dos acertos, não confia cegamente na coluna da planilha
          const sg=parseInt(rw[6])||0,ps=parseInt(rw[7])||0,si=parseInt(rw[8])||0;
          const dg=String(rw[9]||''),ds=String(rw[10]||''),di=String(rw[11]||'');
          const c=cx.toLowerCase();
          let rel=['Suporte Geral','Processos Saques','Suporte Integração'];
          if(c.includes('silver'))rel=['Suporte Geral'];
          else if(c.includes('max'))rel=['Suporte Geral','Processos Saques'];
          else if(c.includes('integração')||c.includes('integra'))rel=['Suporte Geral','Suporte Integração'];
          else if((c.includes('frente')||c.includes('estratég'))&&nm.toLowerCase().includes('kendra'))rel=['Suporte Geral','Processos Saques'];
          const ta_r=rel.reduce((s,sn)=>s+(sn==='Suporte Geral'?Math.round(sg/100*20):sn==='Processos Saques'?Math.round(ps/100*5):Math.round(si/100*5)),0);
          const tq_r=rel.reduce((s,sn)=>s+(sn==='Suporte Geral'?20:5),0);
          return{nome:nm,caixa:cx,ta_g,tq_g:30,pct_g,ta_r,tq_r,pct_r:tq_r?Math.round(ta_r/tq_r*100):0,secoes_relevantes:rel,
            secoes:{'Suporte Geral':{pct:sg,dificuldade:dg},'Processos Saques':{pct:ps,dificuldade:ds},'Suporte Integração':{pct:si,dificuldade:di}},detalhes:[]};
        });
        // Ler detalhes
        const wsD=wb.Sheets['Detalhes'];
        if(wsD){const dR=XLSX.utils.sheet_to_json(wsD,{header:1,defval:''});if(dR.length>1){const nC=dR[0].length;const nms=dR[0].slice(3,nC-2).map(n=>String(n||'').trim());dR.slice(1).forEach(rw=>{const sec=String(rw[1]||'').trim(),top=String(rw[2]||'').trim();nms.forEach((nd,ni)=>{const v=String(rw[3+ni]||'').trim();const an=analistas.find(a=>a.nome===nd);if(an)an.detalhes.push({secao:sec,topico:top,acertou:v==='✓'?1:0});});});}}
      }
      // FORMATO 2: Planilha de revisão manual (aba "Revisão de Correção")
      else {
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        // Extrair analistas e suas correções
        const anMap={};let curSecao='',curTopico='',inResps=false;
        rows.forEach(rw=>{
          const a=String(rw[0]||'').trim(),e=String(rw[4]||'').trim();
          if(a.startsWith('═══'))curSecao=a.replace(/═/g,'').trim();
          else if(a.startsWith('Q')&&/^Q\d+$/.test(a)){curTopico=String(rw[1]||'').trim();inResps=false;}
          else if(a==='Analista'){inResps=true;}
          else if(inResps&&a&&a!=='GABARITO'&&a!=='Enunciado:'&&isAcertoSymbol(e)!==null){
            if(!anMap[a])anMap[a]={nome:a,ta_g:0,tq_g:0,detalhes:[],secoes:{'Suporte Geral':{ac:0,tot:0},'Processos Saques':{ac:0,tot:0},'Suporte Integração':{ac:0,tot:0}}};
            const acertou=isAcertoSymbol(e)?1:0;
            const sec=curSecao.includes('GERAL')?'Suporte Geral':curSecao.includes('SAQUES')?'Processos Saques':'Suporte Integração';
            anMap[a].detalhes.push({secao:sec,topico:curTopico,acertou});
            anMap[a].ta_g+=acertou;anMap[a].tq_g++;
            anMap[a].secoes[sec].ac+=acertou;anMap[a].secoes[sec].tot++;
          }
        });
        analistas=Object.values(anMap).map(a=>{
          const sg=a.secoes['Suporte Geral'].tot?Math.round(a.secoes['Suporte Geral'].ac/a.secoes['Suporte Geral'].tot*100):0;
          const ps=a.secoes['Processos Saques'].tot?Math.round(a.secoes['Processos Saques'].ac/a.secoes['Processos Saques'].tot*100):0;
          const si=a.secoes['Suporte Integração'].tot?Math.round(a.secoes['Suporte Integração'].ac/a.secoes['Suporte Integração'].tot*100):0;
          const pct_g=a.tq_g?Math.round(a.ta_g/a.tq_g*100):0;
          return{nome:a.nome,caixa:String(a.caixa||''),ta_g:a.ta_g,tq_g:30,pct_g,ta_r:a.ta_g,tq_r:30,pct_r:pct_g,secoes_relevantes:['Suporte Geral','Processos Saques','Suporte Integração'],
            secoes:{'Suporte Geral':{pct:sg},'Processos Saques':{pct:ps},'Suporte Integração':{pct:si}},detalhes:a.detalhes};
        });
      }

      if(!analistas.length){toast('Nenhum analista encontrado');return;}
      if(!db.avalConhecimentos)db.avalConhecimentos=[];
      const id='ac'+Date.now();
      db.avalConhecimentos.push({id,nome,data,month,analistas,importedAt:new Date().toISOString()});
      _lastEdit=Date.now();
      try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}
      route.teamId=id;render();
      toast('✓ '+analistas.length+' analistas importados');
    }catch(err){toast('Erro: '+err.message);console.error(err);}
  };
  rd.readAsArrayBuffer(fileEl.files[0]);
}

let trainFilter='Todos';
function parseDateBR(s){
  if(!s)return null;
  s=String(s).trim();
  const parts=s.split('/');
  if(parts.length===2){
    // dd/mm — assume ano atual
    const y=new Date().getFullYear();
    const d=new Date(y,parseInt(parts[1])-1,parseInt(parts[0]));
    return isNaN(d)?null:d;
  }
  if(parts.length===3){
    // dd/mm/aaaa
    const d=new Date(parseInt(parts[2]),parseInt(parts[1])-1,parseInt(parts[0]));
    return isNaN(d)?null:d;
  }
  return null;
}

    else{const text=new TextDecoder('utf-8').decode(r.result);rows=parseCSV(text,detectDelim(text)).filter(rw=>rw.some(c=>c&&c.trim()));}

function migrateToNextMonth(type, id){
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const parts=db.current.split(' ');
  const mi=meses.indexOf(parts[0]);
  const yr=parseInt(parts[1]);
  const nextMi=(mi+1)%12;
  const nextYr=mi===11?yr+1:yr;
  const nextMonth=meses[nextMi]+' '+nextYr;
  // Garantir que o próximo mês existe
  if(!db.months.includes(nextMonth))db.months.push(nextMonth);
  const arr=type==='doc'?db.docs:db.actions;
  const item=arr.find(a=>a.id===id);
  if(!item){toast('Item não encontrado');return;}
  // Marcar original como migrado
  item.status='Migrado';
  // Criar cópia no próximo mês
  const copy=JSON.parse(JSON.stringify(item));
  copy.id=type[0]+Date.now()+Math.random().toString(36).slice(2,5);
  copy.month=nextMonth;
  copy.status='Pendente';
  arr.push(copy);
  persist();render();
  toast('Migrado para '+nextMonth);
}

function migrarParaProximoMes(type, id){
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const [mesNome,anoStr]=db.current.split(' ');
  const mesIdx=meses.indexOf(mesNome);
  const nextMes=mesIdx===11?meses[0]+' '+(parseInt(anoStr)+1):meses[mesIdx+1]+' '+anoStr;
  // Garantir que o mês seguinte existe
  if(!db.months.includes(nextMes))db.months.push(nextMes);
  if(type==='action'){
    const orig=db.actions.find(a=>a.id===id);if(!orig)return;
    const clone={...orig,id:'a'+Date.now()+Math.random().toString(36).slice(2,6),month:nextMes,status:'Pendente'};
    db.actions.push(clone);
    orig.status='Migrado';
  }else if(type==='doc'){
    const orig=db.docs.find(d=>d.id===id);if(!orig)return;
    const clone={...orig,id:'d'+Date.now()+Math.random().toString(36).slice(2,6),month:nextMes,status:'Pendente'};
    db.docs.push(clone);
    orig.status='Migrado';
  }
  persist(true);render();
  toast('Migrado para '+nextMes);
}

/* Rede de segurança final: o Firebase proíbe chaves de objeto contendo . $ # [ ] / ou vazias.
   Isso varre QUALQUER estrutura antes de enviar e, se achar uma chave inválida em qualquer
   lugar (mesmo em campos que a gente não previu), converte só aquele objeto numa lista de
   pares {k,v} — o dado não se perde, e o envio nunca mais trava por causa disso. */
function sanitizeFirebaseKeys(value){
  if(Array.isArray(value))return value.map(sanitizeFirebaseKeys);
  if(value&&typeof value==='object'){
    const keys=Object.keys(value);
    const isBad=k=>!k||/[.$#\[\]\/]/.test(k);
    if(keys.some(isBad)){
      console.warn('sanitizeFirebaseKeys: chave inválida encontrada e convertida:',keys.filter(isBad));
      return keys.map(k=>({k,v:sanitizeFirebaseKeys(value[k])}));
    }
    const out={};
    keys.forEach(k=>{out[k]=sanitizeFirebaseKeys(value[k]);});
    return out;
  }
  return value;
}
async function forceSyncAll(silent){
  const el=document.getElementById('force-sync-result');
  if(!silent&&el)el.innerHTML='<span style="color:var(--amber-text)">⟳ Enviando dados...</span>';
  syncStatus='syncing';updateSyncBadge();
  const BASE=FB_URL.replace('.json','');
  // individualTrainings e acompanhamento saem da lista genérica: eles guardam respostas de prova
  // indexadas pelo TEXTO da pergunta, e o Firebase proíbe chaves com . $ # [ ] / — por isso
  // esses dois campos são "limpos" (convertidos pra array) antes de enviar, mais abaixo.
  const fields=['pdis','actions','docs','macros','roster','months','caixas','current','onboardingFeedbacks','avaliacaoGrupos'];
  let ok=true;
  const errorDetails=[];
  for(const field of fields){
    const val=db[field];if(val===undefined)continue;
    try{
      const r=await fetch(`${BASE}/${field}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(sanitizeFirebaseKeys(val))});
      if(!r.ok){
        ok=false;
        let bodyText='';try{bodyText=await r.text();}catch(e2){}
        errorDetails.push(`${field}: HTTP ${r.status} ${r.statusText||''}${bodyText?' — '+bodyText.slice(0,200):''}`);
        console.warn('forceSyncAll fail:',field,r.status,bodyText);
      }
    }catch(e){ok=false;errorDetails.push(`${field}: ${e.message||e}`);console.warn('forceSyncAll error:',field,e);}
  }
  try{
    const cleaned=(db.teamTrainings||[]).map(t=>({
      id:t.id||'',title:t.title||'',date:t.date||'',month:t.month||'',
      status:t.status||'',errMode:t.errMode||'',
      caixas:Array.isArray(t.caixas)?t.caixas:[],
      questions:Array.isArray(t.questions)?t.questions:[],
      results:(Array.isArray(t.results)?t.results:[]).map(r=>({
        analista:r.analista||'',email:r.email||'',caixa:r.caixa||'',
        stars:r.stars||0,ac:r.ac||0,er:r.er||0,feedback:r.feedback||'',
        answersArr:(Array.isArray(t.questions)?t.questions:[]).map(q=>r.answers?!!r.answers[q]:null)
      }))
    }));
    const r=await fetch(`${BASE}/teamTrainings.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(sanitizeFirebaseKeys(cleaned))});
    if(!r.ok){
      ok=false;
      let bodyText='';try{bodyText=await r.text();}catch(e2){}
      errorDetails.push(`teamTrainings: HTTP ${r.status} ${r.statusText||''}${bodyText?' — '+bodyText.slice(0,200):''}`);
      console.warn('forceSyncAll fail: teamTrainings',r.status,bodyText);
    }
  }catch(e){ok=false;errorDetails.push(`teamTrainings: ${e.message||e}`);console.warn('forceSyncAll error: teamTrainings',e);}
  try{
    const cleanedIndiv=(db.individualTrainings||[]).map(it=>({
      id:it.id||'',title:it.title||'',date:it.date||'',month:it.month||'',
      errMode:it.errMode||'',
      caixas:Array.isArray(it.caixas)?it.caixas:[],
      questions:Array.isArray(it.questions)?it.questions:[],
      results:(Array.isArray(it.results)?it.results:[]).map(r=>({
        id:r.id||'',analista:r.analista||'',email:r.email||'',caixa:r.caixa||'',
        stars:r.stars||0,ac:r.ac==null?null:r.ac,er:r.er==null?null:r.er,feedback:r.feedback||'',obs:r.obs||'',
        answersArr:(Array.isArray(it.questions)?it.questions:[]).map(q=>r.answers?(r.answers[q]===true?true:(r.answers[q]===false?false:null)):null),
        semanas:Array.isArray(r.semanas)?r.semanas:[null,null],
        periodo1:r.periodo1||'',periodo2:r.periodo2||''
      }))
    }));
    const r=await fetch(`${BASE}/individualTrainings.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(sanitizeFirebaseKeys(cleanedIndiv))});
    if(!r.ok){
      ok=false;
      let bodyText='';try{bodyText=await r.text();}catch(e2){}
      errorDetails.push(`individualTrainings: HTTP ${r.status} ${r.statusText||''}${bodyText?' — '+bodyText.slice(0,200):''}`);
      console.warn('forceSyncAll fail: individualTrainings',r.status,bodyText);
    }
  }catch(e){ok=false;errorDetails.push(`individualTrainings: ${e.message||e}`);console.warn('forceSyncAll error: individualTrainings',e);}
  try{
    const cleanedAcomp=(db.acompanhamento||[]).map(a=>{
      const pq=Array.isArray(a.provaQuestions)?a.provaQuestions:[];
      const out={...a};
      if(a.prova){
        out.prova={...a.prova,answersArr:pq.map(q=>a.prova.answers?(a.prova.answers[q]===true?true:(a.prova.answers[q]===false?false:null)):null)};
        delete out.prova.answers;
      }
      return out;
    });
    const r=await fetch(`${BASE}/acompanhamento.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(sanitizeFirebaseKeys(cleanedAcomp))});
    if(!r.ok){
      ok=false;
      let bodyText='';try{bodyText=await r.text();}catch(e2){}
      errorDetails.push(`acompanhamento: HTTP ${r.status} ${r.statusText||''}${bodyText?' — '+bodyText.slice(0,200):''}`);
      console.warn('forceSyncAll fail: acompanhamento',r.status,bodyText);
    }
  }catch(e){ok=false;errorDetails.push(`acompanhamento: ${e.message||e}`);console.warn('forceSyncAll error: acompanhamento',e);}
  pendingSync=!ok;
  if(ok){
    syncStatus='ok';lastSyncTime=new Date();
    if(!silent&&el)el.innerHTML='<span style="color:var(--green-text)">✓ Dados enviados! Os outros já podem ver.</span>';
    if(!silent)toast('✓ Sincronizado!');
  } else {
    syncStatus='error';
    if(!silent&&el){
      const detailsHtml=errorDetails.slice(0,6).map(d=>esc(d)).join('<br>');
      el.innerHTML=`<span style="color:var(--red-text)">⚠ Erro ao enviar. Detalhes:</span><div style="margin-top:6px;font-family:monospace;font-size:.8em;color:var(--red-text);background:rgba(239,68,68,.08);border-radius:6px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;max-height:160px;overflow-y:auto">${detailsHtml}</div>`;
    }
  }
  updateSyncBadge();
  return ok;
}
function setTheme(v){
  db.settings.theme=v;
  applyTheme();
  try{localStorage.setItem(KEY_PREFS,JSON.stringify(db.settings));}catch(e){}
  // Atualiza botões de tema no topbar
  document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));
  const themeMap={'claro':'theme-appmax','roxo':'theme-roxo','dark':'theme-dark'};
  const activeBtn=document.getElementById(themeMap[v]);
  if(activeBtn)activeBtn.classList.add('active');
}
function openSettingsRefreshTheme(v){const btns=document.querySelectorAll('.set-sec')[0]?.querySelectorAll('button');const map=['claro','lilas','roxo','dark'];btns&&btns.forEach((b,i)=>b.classList.toggle('on',map[i]===v));}
function setSize(k){db.settings.fontSize=k;applyTheme();savePrefs();const segs=document.querySelectorAll('.set-sec .seg');const sizeSeg=segs[segs.length-1];const map=['sm','md','lg','xl'];sizeSeg&&sizeSeg.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',map[i]===k));}
function setBodyFont(v){db.settings.bodyFont=v;applyTheme();savePrefs();}
function setTitleFont(v){db.settings.titleFont=v;applyTheme();savePrefs();}
function saveSettings(){savePrefs();closeModal();toast('✓ Configurações salvas');}
function resetSettings(){db.settings=defaultSettings();savePrefs();applyTheme();closeModal();render();toast('Padrão restaurado');}

/* ===== misc ===== */
document.getElementById('monthSel').addEventListener('change',e=>{db.current=e.target.value;persist();render();});
function addMonth(){const pwd=prompt('🔒 Senha para adicionar mês:');if(!pwd)return;if(simpleHash(pwd)!==EDIT_HASH){toast('Senha incorreta');return;}const m=prompt('Nome do novo mês (ex: Julho 2026):');if(m&&m.trim()&&!db.months.includes(m.trim())){db.months.push(m.trim());db.current=m.trim();persist();render();toast('✓ Mês adicionado');}}
function dl(csv,name){const blob=new Blob(["\ufeff"+csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);}
function exportCSV(){const rows=[['Tipo','Titulo','Analista/Time','Data','Prioridade','Status','Mes']];inMonth(db.pdis).forEach(p=>rows.push(['PDI',p.title,p.analyst,p.date,p.priority,p.status,p.month]));inMonth(db.actions).forEach(a=>rows.push([a.type,a.title,a.who,a.date,a.priority,a.status,a.month]));inMonth(db.docs).forEach(d=>rows.push(['Documentação',d.title,'',d.month,d.priority,d.status,d.month]));dl(rows.map(r=>r.map(c=>`"${(c==null?'':String(c)).replace(/"/g,'""')}"`).join(',')).join('\n'),`painel-${db.current.replace(' ','-')}.csv`);toast('CSV exportado');}


/* ===== controle de edição por senha ===== */
const EDIT_HASH='5666a050';// hash simples da senha 110819
function simpleHash(s){let h=0;for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0;}return Math.abs(h).toString(16);}
let _editMode=false;
function isEditMode(){return _editMode;}
function setEditMode(on){
  _editMode=on;
  document.body.classList.toggle('editmode',on);
  const btn=document.getElementById('lockBtn');
  if(btn){btn.textContent=on?'🔓':'🔒';btn.title=on?'Clique para bloquear edição':'Clique para editar';}
  if(on)toast('✓ Modo edição ativo');
  else toast('🔒 Modo leitura ativado');
  render();
}
function toggleEditMode(){
  if(_editMode){setEditMode(false);return;}
  const pwd=prompt('🔒 Senha de edição:');
  if(!pwd)return;
  if(simpleHash(pwd)===EDIT_HASH){setEditMode(true);}
  else{toast('Senha incorreta');}
}

applyTheme();
initAvalConhecimento();
render();
initSync();
setTimeout(()=>{const btn=document.getElementById('lockBtn');if(btn)btn.textContent='🔒';},100);
// Inicializar cadeado
setTimeout(()=>{const btn=document.getElementById('lockBtn');if(btn)btn.textContent='🔒';},50);
