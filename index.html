/* ===== APPMAX BRAND LIGHT (Modo Appmax) ===== */
:root{
  --bg:#ffffff; --surface:#f8fafc; --sidebar:#f1f5f9;
  --border:#e2e8f0; --border-2:#cbd5e1;
  --text:#0f172a; --text-2:#475569; --text-3:#94a3b8;
  --primary:#7c3aed; --primary-light:#f3e8ff; --primary-dark:#5b21b6;
  --purple:var(--primary); --purple-2:#8b5cf6; --purple-dark:#5b21b6; --purple-soft:#ede9fe;
  --success:#10b981; --success-light:#d1fae5; --success-dark:#047857;
  --cyan:#06b6d4; --cyan-light:#cffafe; --cyan-dark:#0e7490;
  --warning:#f97316; --warning-light:#ffedd5; --warning-dark:#c2410c;
  --blue:#3b82f6; --blue-soft:#e0ecfd; --blue-text:#1d4ed8;
  --teal:#14b8a6; --teal-soft:#d2f6ef; --teal-text:#0f766e;
  --pink:#ec4899; --pink-soft:#fce4ef; --pink-text:#be185d;
  --amber:#f59e0b; --amber-soft:#fdf0d3; --amber-text:#a8620a;
  --green:#22c55e; --green-soft:#dcf6e4; --green-text:#15803d;
  --red:#ef4444; --red-soft:#fde4e4; --red-text:#b91c1c;
  --slate-soft:#f1f5f9; --slate-text:#475569;
  --card-done:#f0fdf4; --card-done-bd:#86efac;
  --track:#f8fafc; --bar-alt:#e2e8f0; --input-bg:#ffffff; --hover:#f8fafc; --count-bg:#f1f5f9;
  --gold:#f59e0b;
  --font-body:'Inter','Plus Jakarta Sans',-apple-system,sans-serif;
  --font-title:'Inter',Georgia,sans-serif;
  --fs:14px;
  --radius:12px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(15,23,42,.05);
}

body[data-theme="roxo"]{
  /* ===== APPMAX BRAND DARK — inverso oficial do modo claro, mesma paleta ===== */
  --bg:#0B0218; --surface:#170B2E; --sidebar:#0F0620;
  --border:#2F2350; --border-2:#3D2F66;
  --text:#ECEBF0; --text-2:#C3B8DA; --text-3:#8A7DA8;
  --primary:#9B6AFA; --primary-light:#241A44; --primary-dark:#D7C3FE;
  --purple:var(--primary); --purple-2:#B794FF; --purple-dark:#D7C3FE; --purple-soft:#241A44;
  --success:#34d399; --success-light:#0d2e22; --success-dark:#6ee7b7;
  --cyan:#22d3ee; --cyan-light:#0d2c35; --cyan-dark:#a5f3fc;
  --warning:#fb923c; --warning-light:#3a2313; --warning-dark:#fed7aa;
  --blue:#818cf8; --blue-soft:#201f3f; --blue-text:#b4b9fb;
  --teal:#2dd4bf; --teal-soft:#12302c; --teal-text:#7fe4d6;
  --pink:#f472b6; --pink-soft:#3a1f30; --pink-text:#f9a8d4;
  --amber:#fbbf24; --amber-soft:#3a2c12; --amber-text:#fcd34d;
  --green:#4ade80; --green-soft:#14261c; --green-text:#86efac;
  --red:#f87171; --red-soft:#3a1f1f; --red-text:#fca5a5;
  --slate-soft:#241A3A; --slate-text:#C3B8DA;
  --card-done:#12251c; --card-done-bd:#2d5240;
  --track:#1C1233; --bar-alt:#4A3D70; --input-bg:#170B2E; --hover:#1D1440; --count-bg:#2A1F4D;
  --gold:#fbbf24;
  --shadow:0 4px 16px rgba(0,0,0,.5);
}
body[data-theme="roxo"] input,body[data-theme="roxo"] select,body[data-theme="roxo"] textarea{background:var(--input-bg);color:var(--text);border-color:var(--border-2);}
body[data-theme="roxo"] .modal{background:#170B2E;}
body[data-theme="roxo"] select option{background:#170B2E;color:#ECEBF0;}
body[data-theme="roxo"] .mcard{background:var(--surface);}
body[data-theme="roxo"] .acard{background:var(--surface);}
body[data-theme="roxo"] .acard.done{background:var(--card-done);}
body[data-theme="roxo"] .folder{background:var(--surface);border-color:var(--border);}
body[data-theme="roxo"] .folder.neutral{background:var(--surface);}
body[data-theme="roxo"] code{background:var(--track);color:var(--text-2);}
body[data-theme="roxo"] .orgcol{background:var(--surface);}
body[data-theme="roxo"] .orgm{background:var(--input-bg);}
body[data-theme="roxo"] .prio button{background:var(--surface);color:var(--text);}
body[data-theme="roxo"] .seg button{background:var(--surface);color:var(--text);}
body[data-theme="roxo"] .btn{background:var(--surface);color:var(--text);}
body[data-theme="roxo"] .btn.primary{background:var(--purple);color:#fff;}
body[data-theme="roxo"] .selpill{background:var(--surface);color:var(--text);}
body[data-theme="dark"]{
  --bg:#0d0e14; --surface:#151a28; --sidebar:#0f1118;
  --border:#2d3748; --border-2:#3d4556;
  --text:#f9fafb; --text-2:#e5e7eb; --text-3:#9ca3af;
  --primary:#9d4edd; --primary-light:#2d1b4d; --primary-dark:#f3e8ff;
  --purple:var(--primary); --purple-2:#a99cf7; --purple-dark:#f3e8ff; --purple-soft:#2d1b4d;
  --success:#30e5b1; --success-light:#0a3d2d; --success-dark:#ecfdf5;
  --cyan:#06b6d4; --cyan-light:#0c3d4d; --cyan-dark:#ecf8ff;
  --warning:#fb923c; --warning-light:#3d2215; --warning-dark:#fef3c7;
  --blue:#60a5fa; --blue-soft:#1e2c47; --blue-text:#93bcf6;
  --teal:#2dd4bf; --teal-soft:#14322d; --teal-text:#5fd3bb;
  --pink:#f472b6; --pink-soft:#3a1f2d; --pink-text:#f0a0c4;
  --amber:#fbbf24; --amber-soft:#3a2c12; --amber-text:#f1c468;
  --green:#10b981; --green-soft:#064e3b; --green-text:#a7f3d0;
  --red:#ef4444; --red-soft:#5f2c2c; --red-text:#fca5a5;
  --slate-soft:#2a2e3e; --slate-text:#cbd5e1;
  --card-done:#0a1f15; --card-done-bd:#1e4d3a;
  --track:#1e2a3a; --bar-alt:#3d4f62; --input-bg:#1c2333; --hover:#252e3e; --count-bg:#31394f;

  --shadow:0 4px 12px rgba(0,0,0,.4);
}
body[data-theme="dark"] input,body[data-theme="dark"] select,body[data-theme="dark"] textarea{background:var(--input-bg);color:var(--text);border-color:var(--border-2);}
body[data-theme="dark"] .modal{background:#1e1a2d;}
body[data-theme="dark"] .statussel{color:var(--text);}
body[data-theme="dark"] .mcard{background:var(--surface);}
body[data-theme="dark"] .acard{background:var(--surface);}
body[data-theme="dark"] .acard.done{background:var(--card-done);}
body[data-theme="dark"] .folder{background:var(--surface);border-color:var(--border);}
body[data-theme="dark"] .folder.neutral{background:var(--surface);}
body[data-theme="dark"] code{background:var(--track);color:var(--text-2);}
body[data-theme="dark"] .orgcol{background:var(--surface);}
body[data-theme="dark"] .orgm{background:var(--input-bg);}
body[data-theme="dark"] .prio button{background:var(--surface);color:var(--text);}
body[data-theme="dark"] .seg button{background:var(--surface);color:var(--text);}
body[data-theme="dark"] .btn{background:var(--surface);color:var(--text);}
body[data-theme="dark"] .btn.primary{background:var(--purple);color:#fff;}
body[data-theme="dark"] .selpill{background:var(--surface);color:var(--text);}
body[data-theme="dark"] .brand .name{color:#1e3a8a;font-weight:700;}
body[data-theme="roxo"] .brand .name{color:#281E49;font-weight:700;}
body[data-theme="dark"] .filters .ft{background:var(--surface);color:var(--text-2);}
body[data-theme="dark"] .metcell{background:var(--input-bg);}
body[data-theme="dark"] .caixa{background:var(--input-bg);}
body[data-theme="dark"] .donut .hole{background:var(--surface);}
body[data-theme="dark"] .msum .c{background:var(--surface);}
body[data-theme="dark"] select option{background:#211d2e;color:#ece9f5;}
body[data-fs="sm"]{--fs:13px} body[data-fs="md"]{--fs:14px} body[data-fs="lg"]{--fs:15px} body[data-fs="xl"]{--fs:16.5px}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:var(--fs);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
.tfont{font-family:var(--font-title)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:.95em;color:var(--text)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px}
code{background:var(--track);padding:1px 5px;border-radius:5px;font-size:.85em}

.app{display:flex;min-height:100vh}
.sidebar{width:240px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:block;padding:4px}
.brand .badge-wrap{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--purple-2),var(--purple-dark));border-radius:12px;padding:10px 12px;box-shadow:0 4px 12px rgba(109,93,224,.25)}
.brand .star{font-size:13px;margin-right:4px;opacity:.9}
.brand .brand-text{flex:1;min-width:0}
.brand .name{font-family:var(--font-title);font-style:normal;font-weight:600;font-size:13.5px;color:#fff;line-height:1.25;white-space:normal;word-break:break-word}
.brand .sub{font-size:9px;color:rgba(255,255,255,.55);margin-top:3px;white-space:normal;word-break:break-word;font-weight:400;letter-spacing:.02em}
:root .brand .sub{color:#ffffff}
body[data-theme="roxo"] .brand .sub{color:#281E49}
body[data-theme="dark"] .brand .sub{color:#1e3a8a}
.navgroup{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.navgroup:first-child{border-top:none;padding-top:0}
.navgroup .label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:600;padding:0 8px 6px}
.navitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;color:var(--text-2);padding:8px 10px;border-radius:9px;font-size:.9em;font-weight:500;margin-bottom:2px;font-family:inherit;white-space:nowrap;cursor:pointer}
.navitem:hover{background:var(--hover);color:var(--text)}
.navitem.active{background:var(--purple-soft);color:var(--purple-dark)}
.navitem .ic{width:16px;text-align:center;opacity:.85}
.navitem .ct{margin-left:auto;background:var(--count-bg);color:var(--purple-dark);font-size:10.5px;font-weight:600;border-radius:20px;padding:1px 7px;min-width:20px;text-align:center}
.navitem.active .ct{background:var(--surface)}
.sidefoot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:14px;border-top:1px solid var(--border);cursor:pointer;border-radius:9px}
.sidefoot:hover{background:var(--hover)}
.sidefoot .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--purple-2),var(--purple-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.sidefoot .cog{margin-left:auto;color:var(--text-3);font-size:15px}

.main{flex:1;width:0;min-width:0;display:flex;flex-direction:column;overflow-x:hidden}
.topbar{display:flex;align-items:flex-start;gap:14px;padding:18px 28px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.topbar .tt{font-size:.95em;font-weight:600}
.topbar .dt{font-size:.8em;color:var(--text-3);margin-top:1px}
.topbar .actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.theme-icons{display:flex;gap:4px;align-items:center}
.theme-btn{background:transparent;border:1px solid var(--border-2);border-radius:6px;padding:5px 6px;cursor:pointer;font-size:16px;transition:.2s;color:var(--text-3)}
.theme-btn:hover{background:var(--hover);border-color:var(--purple);color:var(--text)}
.theme-btn.active{background:var(--purple-soft);border-color:var(--purple);color:var(--purple)}
.content{padding:24px 28px 60px;width:100%;box-sizing:border-box}

.btn{border:1px solid var(--border-2);background:var(--surface);color:var(--text);border-radius:9px;padding:7px 12px;font-size:.86em;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:.12s;font-family:inherit}
.btn:hover{background:var(--hover);border-color:var(--purple-2)}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.primary:hover{background:var(--purple-dark)}
.btn.sm{padding:5px 9px;font-size:.82em}
.btn.icon{padding:6px 9px}
.selpill{border:1px solid var(--border-2);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:.86em;font-weight:500;color:var(--text)}

.page-h{margin-bottom:20px}
.page-h h1{font-family:var(--font-title);font-weight:600;font-size:2.1em;letter-spacing:-.5px}
.page-h p{color:var(--text-2);font-size:.96em;margin-top:4px}

.mcards{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:22px}
@media(max-width:1200px){.mcards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.mcards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
  .wrap{flex-direction:column}
  .sidebar{width:100%;height:auto;position:relative;border-right:none;border-bottom:1px solid var(--border);padding:12px;overflow-y:visible}
  .sidebar .brand{margin-bottom:8px}
  .sidebar nav{display:flex;flex-wrap:wrap;gap:2px}
  .sidebar .navgroup{margin-top:0;padding-top:0;border-top:none;display:flex;flex-wrap:wrap;gap:2px;align-items:center}
  .sidebar .navgroup .label{padding:4px 8px;font-size:9px;white-space:nowrap}
  .sidebar .navitem{padding:6px 10px;font-size:.82em;white-space:nowrap}
  .sidebar .navitem .ct{font-size:9px;padding:0 5px}
  .main{padding:14px}
  .topbar{flex-wrap:wrap;gap:8px;padding:10px 14px}
  .page-h h1{font-size:1.3em}
  .mcards{grid-template-columns:repeat(2,1fr)!important}
  .grid2{grid-template-columns:1fr!important}
  .tbl{font-size:.82em}
  .modal{width:95vw!important;max-width:95vw!important;margin:10px}
  .panel{padding:12px}
}
@media(max-width:480px){
  .mcards{grid-template-columns:1fr!important}
  .mcard .val{font-size:1.8em}
  .sidebar .navitem .ic{display:none}
}
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;min-height:90px}
:root .mcard{background:#f5f0ff;border-color:#e9d9ff}
.mcard .lbl{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600;line-height:1.3;min-height:auto;display:flex;align-items:flex-start;justify-content:center;text-align:center;padding-right:0}
.mcard .lbl-ic{position:absolute;top:10px;right:10px;color:var(--text-3);font-size:12px}
.mcard .val{font-family:'Inter',var(--font-body);font-size:2.4em;font-weight:800;margin:8px 0 6px;letter-spacing:-.5px;line-height:1;height:auto;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.mcard .foot{font-size:.75em;color:var(--text-3);padding-top:2px}
.mcard .tag{display:inline-block;font-size:10px;font-weight:600;border-radius:20px;padding:1px 7px;margin-top:2px;white-space:nowrap}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:18px}
.panel-h{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.panel-h .pi{width:26px;height:26px;border-radius:8px;background:var(--purple-soft);color:var(--purple-dark);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.panel-h h2{font-size:1.14em;font-weight:600}
.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:18px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}

.barrow{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.barrow .nm{font-size:.9em;color:var(--text-2);width:160px;text-align:right;flex-shrink:0}
.barrow .track{flex:1;height:18px;background:var(--track);border-radius:7px;overflow:hidden}
.barrow .fill{height:100%;border-radius:7px;transition:width .5s}
.barrow .vl{font-size:.9em;font-weight:600;width:46px}

.donut-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:230px}
.donut{position:relative;width:170px;height:170px;border-radius:50%}
.donut .hole{position:absolute;inset:26px;background:var(--surface);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .hole b{font-family:'Inter',var(--font-body);font-size:1.9em;font-weight:700}
.donut .hole span{font-size:.78em;color:var(--text-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:.85em;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

.mbars{display:flex;gap:30px;justify-content:center;align-items:flex-end;height:150px;padding-top:12px}
.mbg{display:flex;flex-direction:column;align-items:center;gap:6px}
.mbg .pair{display:flex;align-items:flex-end;gap:5px;height:120px}
.mbg .b{width:26px;border-radius:5px 5px 0 0;display:flex;justify-content:center;align-items:flex-start;padding-top:3px;font-size:10px;color:var(--purple-dark);font-weight:600;background:var(--purple-2)}
.mbg .b.alt{background:var(--bar-alt)}
.mbg .cap{font-size:.82em;color:var(--text-2)}

.msum{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.msum .c{border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;background:var(--surface)}
.msum .c.cur{border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-soft)}
.msum .c h3{font-family:var(--font-title);font-size:1.28em;font-weight:600}
.msum .c p{font-size:.85em;color:var(--text-2);margin:6px 0}
.msum .c .st{font-size:.82em;color:var(--text-3)}

.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.folder{border:1px solid var(--card-done-bd);border-top:3px solid var(--green);border-radius:var(--radius);padding:16px 18px;background:var(--card-done);cursor:pointer;transition:.15s}
.folder.neutral{background:var(--surface);border-color:var(--border);border-top-color:var(--purple)}
.folder:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(40,30,80,.07)}
.folder .ico{font-size:24px;margin-bottom:8px}
.folder h3{font-size:1.05em;font-weight:600}
.folder .meta{font-size:.85em;color:var(--text-2);margin-top:2px}
.folder .chip{display:inline-block;margin-top:9px;font-size:.78em;font-weight:600;color:var(--green-text);background:var(--surface);border:1px solid var(--card-done-bd);border-radius:20px;padding:2px 9px}

.metgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:6px}
.metcell{background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px}
.metcell .k{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.metcell .v{font-family:'Inter',var(--font-body);font-size:1.1em;font-weight:600;margin-top:6px}
.metcell .v b{font-weight:700}.metcell .v .ar{color:var(--text-3);margin:0 4px}
.delta{display:inline-block;margin-top:7px;font-size:.78em;font-weight:600;border-radius:6px;padding:1px 7px}
.delta.up{background:var(--green-soft);color:var(--green-text)}
.delta.down{background:var(--red-soft);color:var(--red-text)}

.formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:6px}
.fld label{display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--border-2);border-radius:9px;padding:9px 11px;background:var(--input-bg)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--purple-2);box-shadow:0 0 0 3px var(--purple-soft);background:var(--surface)}

.filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.filters .ft{border:1px solid var(--border-2);background:var(--surface);border-radius:8px;padding:6px 13px;font-size:.86em;color:var(--text-2);font-weight:500}
.filters .ft.on{background:var(--purple-soft);border-color:var(--purple-2);color:var(--purple-dark)}
.acards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:800px){.acards-grid{grid-template-columns:1fr}}
.acard{position:relative;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--red);border-radius:var(--radius);padding:16px 18px 14px 18px}
.acard.done{background:var(--card-done);border-color:var(--card-done-bd);opacity:.82}
.acard .top{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.acard .top-left{flex:1;min-width:0}
.acard h3{font-size:1em;font-weight:600;line-height:1.3}
.acard .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.acard .dates{font-size:.8em;color:var(--text-2);margin-top:7px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.acard .timer{display:inline-flex;align-items:center;gap:4px;font-size:.8em;font-weight:600;color:var(--purple-dark);margin-top:5px}
.acard .desc{font-size:.88em;color:var(--text-2);margin-top:8px;line-height:1.5;border-top:1px solid var(--border);padding-top:8px}
.acard .rt{display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.acard .x{border:1px solid var(--border-2);background:var(--surface);border-radius:8px;width:28px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:.85em}
body:not(.editmode) .acard .x{display:none!important}
body:not(.editmode) .orgx{display:none!important}
body:not(.editmode) [onclick*="delTeam"]{display:none!important}
body:not(.editmode) [onclick*="delPdiGroup"]{display:none!important}
.acard .x:hover{color:var(--red);border-color:var(--red)}

.badge{font-size:.78em;font-weight:600;border-radius:7px;padding:3px 9px;white-space:nowrap}
.statussel{border-radius:8px;padding:5px 8px;font-size:.8em;font-weight:600;border:1px solid transparent}

.tbl{width:100%;border-collapse:collapse;font-size:.88em}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border)}
.tbl td{padding:13px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl .pos{color:var(--green-text);font-weight:600}.tbl .neg{color:var(--red-text);font-weight:600}
.wrap-x{overflow-x:auto}

.impa{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.impa .av{width:32px;height:32px;border-radius:50%;background:var(--purple-soft);color:var(--purple-dark);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.impa .nm{font-size:.9em;font-weight:500;width:130px;flex-shrink:0}
.impa .track{flex:1;height:9px;background:var(--track);border-radius:6px;overflow:hidden}
.impa .fill{height:100%;background:var(--green);border-radius:6px}
.impa .vl{font-size:.88em;font-weight:600;width:78px;text-align:right}

.caixa{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:12px;background:var(--input-bg)}
.caixa.worst{border-color:var(--red);background:var(--red-soft)}
.caixa .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px}
.caixa .ch b{font-size:1em}
.caixa .nums{font-size:.86em;color:var(--text-2)}
.warnchip{font-size:10.5px;font-weight:700;color:var(--red-text);background:var(--surface);border:1px solid var(--red);border-radius:20px;padding:2px 9px;margin-left:8px}
.ratebar{height:8px;background:var(--green-soft);border-radius:6px;overflow:hidden}
.ratebar .er{height:100%;background:var(--red);border-radius:6px}

.starrow{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.starrow .nm{width:150px;font-size:.9em;flex-shrink:0}
.starrow .stars{color:var(--gold);font-size:1.05em;letter-spacing:1px;width:96px}
.starrow .track{flex:1;height:9px;background:var(--track);border-radius:6px;overflow:hidden}
.starrow .fill{height:100%;background:var(--gold);border-radius:6px}
.starrow .vl{font-size:.88em;font-weight:600;width:34px;text-align:right}

.qrow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qrow .rk{width:24px;height:24px;border-radius:7px;background:var(--red-soft);color:var(--red-text);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8em;flex-shrink:0}
.qrow .nm{flex:1;font-size:.92em}
.qrow .track{width:120px;height:8px;background:var(--track);border-radius:6px;overflow:hidden}
.qrow .fill{height:100%;background:var(--red);border-radius:6px}
.qrow .vl{font-size:.85em;font-weight:600;width:74px;text-align:right;color:var(--red-text)}

.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;align-items:center;gap:7px;border:1px solid var(--border-2);border-radius:9px;padding:8px 12px;font-size:.9em;cursor:pointer;background:var(--input-bg)}
.chk input{width:auto}

.overlay{position:fixed;inset:0;background:rgba(20,15,40,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:36px 16px;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:16px;padding:24px 26px;width:600px;max-width:100%;box-shadow:0 24px 60px rgba(20,15,45,.3)}
.modal h2{font-size:1.25em;font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal .close{border:none;background:var(--hover);border-radius:8px;width:30px;height:30px;color:var(--text-2);font-size:16px}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.modal .full{margin-bottom:14px}
.prio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.prio button{border:1px solid var(--border-2);background:var(--surface);border-radius:9px;padding:9px;font-size:.9em;font-weight:500;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--text)}
.prio button.on{border-color:var(--purple-2);background:var(--purple-soft)}
.prio .dot{width:9px;height:9px;border-radius:50%}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.seg button{border:1px solid var(--border-2);background:var(--surface);border-radius:9px;padding:9px 6px;font-size:.85em;font-weight:500;color:var(--text);font-family:inherit}
.seg button.on{border-color:var(--purple);background:var(--purple-soft);color:var(--purple-dark)}
.swatch{width:100%;height:34px;border-radius:8px;border:1px solid var(--border-2);margin-bottom:5px}
.set-sec{margin-bottom:20px}
.set-sec h3{font-size:.92em;font-weight:600;margin-bottom:10px}

.empty{text-align:center;color:var(--text-3);padding:50px 20px;font-size:.95em}
.orgboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;align-items:start}
.orgcol{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.orgcol .orgh{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.orgcol .orgh b{font-size:1em;flex:1;outline:none;border-radius:6px;padding:1px 3px}
.orgcol .orgh b:focus{background:var(--purple-soft)}
.orgct{background:var(--count-bg);color:var(--purple-dark);font-size:11px;font-weight:600;border-radius:20px;padding:1px 8px}
.orgx{border:none;background:none;color:var(--text-3);font-size:14px;cursor:pointer;padding:2px 4px}
.orgx:hover{color:var(--red)}
.orgm{display:flex;align-items:center;gap:9px;padding:8px;border-radius:9px;border:1px solid var(--border);margin-bottom:7px;background:var(--input-bg)}
.orgm .av{width:30px;height:30px;border-radius:50%;background:var(--purple-soft);color:var(--purple-dark);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.orgm .onm{font-size:.9em;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orgm .oem{font-size:.74em;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orgm select{border:1px solid var(--border-2);border-radius:7px;padding:4px 5px;background:var(--surface);color:var(--text);font-size:.78em;max-width:96px}
.orgempty{font-size:.82em;color:var(--text-3);text-align:center;padding:14px 0;border:1px dashed var(--border-2);border-radius:9px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 20px;border-radius:10px;font-size:.9em;opacity:0;transition:.25s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hint{font-size:.85em;color:var(--text-3);margin-top:4px}

/* ===== Firebase Realtime Database sync ===== */
const KEY='painel_treino_suporte_v2';
const KEY_PREFS='painel_prefs_local'; // aparência — só local, não sincroniza
const KEY_PENDING='painel_pending_sync_v1'; // marca se há alterações locais ainda não enviadas ao Firebase
const FB_BASE='https://painel-aime-default-rtdb.firebaseio.com/painel';
const FB_URL=FB_BASE+'.json';
let mem=null;
let syncTimer=null;
let syncStatus='ok';
let lastSyncTime=null;
let _syncing=false;
// pendingSync precisa sobreviver a um F5 — por isso é espelhado no localStorage
// a cada leitura/escrita, em vez de ser só uma variável solta em memória.
let _pendingSyncVal=(function(){try{return localStorage.getItem(KEY_PENDING)==='1';}catch(e){return false;}})();
Object.defineProperty(window,'pendingSync',{
  get(){return _pendingSyncVal;},
  set(v){
    _pendingSyncVal=!!v;
    try{if(_pendingSyncVal)localStorage.setItem(KEY_PENDING,'1');else localStorage.removeItem(KEY_PENDING);}catch(e){}
  }
});

function loadPrefs(){try{const r=localStorage.getItem(KEY_PREFS);if(r)return JSON.parse(r);}catch(e){}return null;}
function savePrefs(){try{localStorage.setItem(KEY_PREFS,JSON.stringify(db.settings));}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return mem?JSON.parse(JSON.stringify(mem)):null;}

function persist(skipRender){
  _lastEdit=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){mem=JSON.parse(JSON.stringify(db));}
  savePrefs();
  if(!skipRender&&document.getElementById('content'))render();
  // Sincronização com Firebase agora é 100% manual — veja Configurações > "Enviar todos os dados agora"
  // ou o botão "↻ Atualizar" no topo. Isso evita que uma sincronização automática em segundo plano
  // sobrescreva dados digitados há pouco com uma versão desatualizada do servidor.
  pendingSync=true;
  updateSyncBadge();
}

async function sendToFirebase(){
  if(_syncing)return;
  _syncing=true;
  syncStatus='syncing';updateSyncBadge();
  const fields=['pdis','actions','docs','macros','roster','months','caixas','current','onboardingFeedbacks','avaliacaoGrupos','acompanhamento','individualTrainings'];
  let allOk=true;
  // Envia campo por campo
  for(const f of fields){
    const v=db[f];
    if(v===undefined||v===null)continue;
    try{
      const r=await fetch(`${FB_BASE}/${f}.json`,{
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(v)
      });
      if(!r.ok)allOk=false;
    }catch(e){allOk=false;}
  }
  // teamTrainings separado — converte answers para array
  try{
    const tt=(db.teamTrainings||[]).map(t=>({
      id:t.id||'',title:t.title||'',date:t.date||'',
      month:t.month||'',status:t.status||'',errMode:t.errMode||'',
      caixas:t.caixas||[],questions:t.questions||[],
      results:(t.results||[]).map(r=>({
        analista:r.analista||'',email:r.email||'',caixa:r.caixa||'',
        stars:r.stars||0,ac:r.ac||0,er:r.er||0,feedback:r.feedback||'',
        answersArr:(t.questions||[]).map(q=>r.answers?!!r.answers[q]:null)
      }))
    }));
    const r=await fetch(`${FB_BASE}/teamTrainings.json`,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(tt)
    });
    if(!r.ok)allOk=false;
  }catch(e){allOk=false;}
  if(allOk){
    syncStatus='ok';lastSyncTime=new Date();pendingSync=false;
  } else {
    syncStatus='error';
  }
  _syncing=false;
  updateSyncBadge();
}

    return;

async function pullFromFirebase(){
  if(_syncing)return false;
  syncStatus='syncing';updateSyncBadge();
  try{
    const r=await fetch(FB_URL+'?t='+Date.now());
    if(!r.ok){syncStatus='error';updateSyncBadge();return false;}
    const data=await r.json();
    if(!data||typeof data!=='object'||!data.months){
      syncStatus='ok';updateSyncBadge();return false;
    }
    // Proteção: nunca sobrescreve se há qualquer alteração local ainda não enviada
    const toArr=v=>!v?[]:Array.isArray(v)?v:Object.values(v);
    if(pendingSync){
      syncStatus='ok';lastSyncTime=new Date();updateSyncBadge();
      return false;
    }
    // Aplica dados do Firebase
    const prefs=loadPrefs()||db.settings||defaultSettings();
    const curMonth=db.current;
    let bim=null;try{bim=localStorage.getItem('ob_bimestre');}catch(e){}
    const curBim=db.onboardingBimestre;
    // Preservar feedbacks locais se existirem (podem ser mais recentes que Firebase)
    const localFeedbacks=db.onboardingFeedbacks&&db.onboardingFeedbacks.length?db.onboardingFeedbacks:null;
    const localFeedbacksCount=localFeedbacks?localFeedbacks.length:0;
    // Preservar estado de navegação da aba avaliação
    const curAvSub=db._avaliacaoSub;
    const curAvGrupo=db._avGrupo;
    const curAvSem=db._avSem;
    const curTriQ=db._triQ;
    const curTriAno=db._triAno;
    db=data;
    db.settings=prefs;
    db.settings.titles=Object.assign({},DEFAULT_TITLES,db.settings.titles||{});
    // Forçar títulos renomeados — sobrescrever valores antigos salvos
    db.settings.titles.onboarding='Feedback Onboarding B2B';
    db.settings.titles.avaliacao='Onboarding B2B';
    if(curMonth&&db.months&&toArr(db.months).includes(curMonth))db.current=curMonth;
    db.onboardingBimestre=bim||curBim||db.onboardingBimestre||'2025-07';
    // Restaurar estado de navegação
    if(curAvSub)db._avaliacaoSub=curAvSub;
    if(curAvGrupo!=null)db._avGrupo=curAvGrupo;
    if(curAvSem!=null)db._avSem=curAvSem;
    if(curTriQ!=null)db._triQ=curTriQ;
    if(curTriAno!=null)db._triAno=curTriAno;
    // Normalizar todos os arrays
    db.pdis=toArr(db.pdis);
    db.actions=toArr(db.actions);
    db.docs=toArr(db.docs);
    db.teamTrainings=toArr(db.teamTrainings);
    db.individualTrainings=toArr(db.individualTrainings);
    db.macros=toArr(db.macros);
    db.roster=toArr(db.roster);
    db.months=toArr(db.months);
    db.onboardingFeedbacks=toArr(db.onboardingFeedbacks);
    // Se tínhamos mais feedbacks localmente do que o Firebase retornou, manter os locais
    if(localFeedbacks&&localFeedbacksCount>db.onboardingFeedbacks.length){
      db.onboardingFeedbacks=localFeedbacks;
    }
    db.caixas=toArr(db.caixas);
    if(!db.caixas.length)db.caixas=DEFAULT_CAIXAS.slice();
    if(!db.current)db.current=db.months[db.months.length-1]||'Junho 2026';
    if(!db.roster||!db.roster.length)db.roster=defaultRoster();
    if(!db.macros)db.macros=[];
    // Sanitizar datas
    const sd=v=>v==null?'':String(v);
    db.pdis.forEach(p=>{p.dataSolic=sd(p.dataSolic);p.dateConc=sd(p.dateConc);p.date=sd(p.date);});
    db.actions.forEach(a=>{a.dataSolic=sd(a.dataSolic);a.dateConc=sd(a.dateConc);a.date=sd(a.date);});
    db.docs.forEach(d=>{d.dataSolic=sd(d.dataSolic);d.dateConc=sd(d.dateConc);});
    db.macros.forEach(m=>{if(m){m.dataSolic=sd(m.dataSolic);m.dateConc=sd(m.dateConc);}});
    db.teamTrainings.forEach(t=>{
      t.results=toArr(t.results);t.caixas=toArr(t.caixas);t.questions=toArr(t.questions);
      t.date=sd(t.date);
      t.results.forEach(r=>{
        r.analista=r.analista||'';r.caixa=r.caixa||'';
        if(r.answersArr&&t.questions.length){r.answers={};t.questions.forEach((q,i)=>{r.answers[q]=r.answersArr[i];});}
        if(!r.answers)r.answers={};
      });
    });
    db.individualTrainings.forEach(it=>{
      it.results=toArr(it.results);it.questions=toArr(it.questions);
      it.results.forEach(r=>{
        if(r.answersArr&&it.questions.length){r.answers={};it.questions.forEach((q,i)=>{r.answers[q]=r.answersArr[i];});}
        if(!r.answers)r.answers={};
        if(!r.semanas)r.semanas=[null,null];
      });
    });
    db.acompanhamento=toArr(db.acompanhamento);
    db.acompanhamento.forEach(a=>{
      if(!a)return;
      if(a.prova&&a.prova.answersArr&&Array.isArray(a.provaQuestions)&&a.provaQuestions.length){
        a.prova.answers={};a.provaQuestions.forEach((q,i)=>{a.prova.answers[q]=a.prova.answersArr[i];});
      }
      if(a.prova&&!a.prova.answers)a.prova.answers={};
    });
    try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}
    // Reconstruir avaliação de conhecimento (dados embutidos, não vêm do Firebase)
    initAvalConhecimento();
    syncStatus='ok';lastSyncTime=new Date();updateSyncBadge();
    applyTheme();render();
    return true;
  }catch(e){
    syncStatus='error';updateSyncBadge();
    console.warn('pull error:',e);
    // Se deu erro mas localStorage tem dados, renderiza com o local
    const local=load();
    if(local&&local.months){db=local;render();}
    return false;
  }
}

function rosterCaixa(name,email){
  const r=db.roster||[];
  /* 1. match por e-mail exato */
  if(email){const m=r.find(x=>x.email&&x.email.toLowerCase().trim()===email.toLowerCase().trim());if(m)return m.caixa;}
  /* 2. match por nome exato */
  const nn=normName(name);if(nn){const m=r.find(x=>normName(x.name)===nn);if(m)return m.caixa;}
  /* 3. match parcial: primeiro nome + sobrenome bateram */
  if(nn){const parts=nn.split(' ').filter(Boolean);const m=r.find(x=>{const xp=normName(x.name).split(' ').filter(Boolean);return parts.length>=2&&xp.length>=2&&parts[0]===xp[0]&&parts[parts.length-1]===xp[xp.length-1];});if(m)return m.caixa;}
  return '';
}
function upsertRoster(name,email,caixa){

  let html=`<div class="val" style="color:${cores.val}">${pct}%</div>`;
  html+=`<span class="tag" style="background:${cores.bg};color:${cores.text}">${status} · ${count} analista${count!==1?'s':''}</span>`;
  html+=alerta?`<div class="foot" style="color:var(--red-text);margin-top:4px">🔴 ${alerta}</div>`:`<div class="foot">&nbsp;</div>`;
  return html;
}
// ===== FUNÇÃO GLOBAL: CALCULAR RAMPAGEM =====
function calcularRampagem(acompanhamento, mesAtual) {
  const _meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  
  // Filtrar por mês atual
  const acompMes=a=>{
    const p=a.periodo1||a.month||'';
    const m=p.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(m)return _meses[parseInt(m[2])-1]+' '+m[3];
    if(a.month)return a.month;
    return null;
  };
  const acomp=(acompanhamento||[]).filter(a=>{const m=acompMes(a);return !m||m===mesAtual;});
  
  if(!acomp.length)return null;
  
  const getMetas=cx=>{
    const c=(cx||'').toLowerCase();
    if(c.includes('silver'))return{sla:5,csat:94,tma:24};
    if(c.includes('integração')||c.includes('integra'))return{sla:3,csat:97,tma:24};
    if(c.includes('vip')||c.includes('saque'))return{sla:3,csat:97,tma:24};
    return{sla:5,csat:94,tma:24};
  };
  
  const calcStatus=(arr)=>{
    const results=arr.map(a=>{
      const rawSem=a.semanas||[];
      const s3=Array.isArray(rawSem)?rawSem[2]:(rawSem[2]??rawSem['2']??null);
      
      if(!s3)return null;
      
      const meta=getMetas(a.caixa);
      let metricasOk=0, totalMetricas=0;
      const metricaFora=null;
      
      // SLA: menos é melhor
      if(s3.sla!=null&&s3.sla!==''){
        totalMetricas++;
        const slaVal=parseFloat(s3.sla);
        if(slaVal<=meta.sla)metricasOk++;
      }
      
      // CSAT: mais é melhor
      if(s3.csat!=null&&s3.csat!==''){
        totalMetricas++;
        const csatVal=parseFloat(s3.csat);
        if(csatVal>=meta.csat)metricasOk++;
      }
      
      // TMA: meta é 24h (quanto menor melhor)
      if(s3.tma!=null&&s3.tma!==''){
        totalMetricas++;
        const tmaVal=parseFloat(s3.tma);
        // Se S3 <= 24h = OK
        if(tmaVal<=24)metricasOk++;
      }
      
      // Recebidas: mais é melhor, se >= 60% é OK
      if(s3.recebidas!=null&&s3.recebidas!==''){
        totalMetricas++;
        const recVal=parseFloat(s3.recebidas);
        if(recVal>=60)metricasOk++;
      }
      
      // Fechadas: mais é melhor, se >= 60% é OK
      if(s3.fechadas!=null&&s3.fechadas!==''){
        totalMetricas++;
        const fechVal=parseFloat(s3.fechadas);
        if(fechVal>=60)metricasOk++;
      }
      
      const pctMetricas=totalMetricas?Math.round(metricasOk/totalMetricas*100):0;
      
      return {
        nome:a.nome,
        caixa:a.caixa,
        pctMetricas,
        metricasOk,
        totalMetricas
      };
    }).filter(v=>v!==null);
    
    const pctMedio=results.length?Math.round(results.reduce((s,r)=>s+r.pctMetricas,0)/results.length):0;
    
    return {
      pct:pctMedio,
      count:results.length,
      details:results,
      status:pctMedio>=70?'Sucesso':(pctMedio>=50?'Acompanhar':'Atenção'),
      cor:pctMedio>=70?'var(--green)':(pctMedio>=50?'var(--yellow-text)||#FFB800':'var(--red-text)')
    };
  };
  
  return calcStatus(acomp);
}

/* ---------- IMPACTO - PDI ---------- */
let pdiAnalystFilter='Todos';
function viewImpactoPdi(){
  const allPdis=inMonth(db.pdis).filter(p=>p.hasResults);
  if(!allPdis.length)return `<div class="page-h"><h1>${esc(T('impacto-pdi'))}</h1><p>Consolidado automático de todos os PDIs com resultados preenchidos.</p></div><div class="empty">Nenhum PDI com resultados neste mês ainda.</div>`;

  const avg=k=>round(pdis.reduce((s,p)=>s+pdiMetrics(p)[k],0)/pdis.length,1);
  const A={sla:avg('sla'),cr:avg('cr'),cf:avg('cf'),tma:avg('tma'),cs:avg('cs')};
  const card=(l,v)=>`<div style="background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:14px 16px"><div style="font-size:10px;letter-spacing:.05em;text-transform:uppercase;opacity:.85">${l}</div><div style="font-family:'Inter',sans-serif;font-size:1.9em;font-weight:700;margin-top:6px;letter-spacing:-.5px;color:#fff">+${v}%</div><div style="font-size:.78em;opacity:.8;margin-top:2px">↑ melhora</div></div>`;
  const mt=[['SLA 1ª resp / média (min)','sla'],['Chats resp / média dia','cr'],['Chats fech / média dia','cf'],['TMA / média dia (h)','tma'],['CSAT / semanal','cs']];
  const maxA=Math.max(...mt.map(([_,k])=>Math.abs(A[k])),1);
  const evol=mt.map(([l,k])=>`<div class="barrow"><div class="nm">${l}</div><div class="track"><div class="fill" style="width:${Math.abs(A[k])/maxA*100}%;background:var(--green)"></div></div><div class="vl" style="color:var(--green-text)">+${A[k]}%</div></div>`).join('');
  const byA=pdis.map(p=>({a:p.analyst,o:pdiOverall(p)})).sort((x,y)=>y.o-x.o),maxO=Math.max(...byA.map(b=>b.o),1);
  const impa=byA.map(b=>`<div class="impa"><div class="av">${esc(ini(b.a))}</div><div class="nm">${esc(b.a)}</div><div class="track"><div class="fill" style="width:${b.o/maxO*100}%"></div></div><div class="vl">+${round(b.o,1)}%</div></div>`).join('');
  const ad=(b,a,u,im)=>`${fmt(b)}${u}→<b>${fmt(a)}${u}</b> <span class="${im>=0?'pos':'neg'}">(${im>=0?'+':''}${round(im,1)}%)</span>`;
  const rt=pdis.map(p=>{const x=pdiMetrics(p),m=p.m;return `<tr><td><b>${esc(p.analyst)}</b></td><td style="color:var(--text-2)">${esc(p.title)}</td><td>${ad(m.slaB,m.slaA,'min',x.sla)}</td><td>${ad(m.crB,m.crA,'',x.cr)}</td><td>${ad(m.cfB,m.cfA,'',x.cf)}</td><td>${ad(m.tmaB,m.tmaA,'h',x.tma)}</td><td>${ad(m.csB,m.csA,'%',x.cs)}</td><td>${ad(m.evalB,m.evalA,'',x.eval)}</td><td class="pos">+${round(pdiOverall(p),1)}%</td></tr>`;}).join('');
  const filterBtns=analysts.map(a=>`<button class="ft ${pdiAnalystFilter===a?'on':''}" onclick="pdiAnalystFilter='${a.replace(/'/g,"\'")}';render()">${esc(a)}</button>`).join('');

  <div class="filters" style="margin-bottom:18px"><span style="font-size:.85em;color:var(--text-3);align-self:center">Filtrar por analista:</span>${filterBtns}</div>
  <div style="background:linear-gradient(120deg,#6d5de0,#5848c4);color:#fff;border-radius:var(--radius);padding:20px 22px;margin-bottom:18px"><div style="font-family:'Inter',sans-serif;font-size:1.25em;font-weight:700;margin-bottom:14px;color:#fff">Impacto consolidado dos PDIs — ${db.current}${pdiAnalystFilter!=='Todos'?' · '+esc(pdiAnalystFilter):''} ✦</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px">${card('SLA 1ª resp / média (min)',A.sla)}${card('Chats resp / média dia',A.cr)}${card('Chats fech / média dia',A.cf)}${card('TMA / média dia (h)',A.tma)}${card('CSAT / semanal',A.cs)}</div></div>
  <div class="grid2"><div class="panel"><div class="panel-h"><div class="pi">↑</div><h2>Evolução por métrica</h2></div>${evol}</div><div class="panel"><div class="panel-h"><div class="pi">◉</div><h2>Melhora por analista</h2></div>${impa}</div></div>

/* ---------- IMPACTO - TREINAMENTO ---------- */
function teamCompute(t){
  const res=t.results||[],qs=t.questions||[];
  const analysts=res.map(r=>{const ans=r.answers||{};let ac,er;if(typeof r.ac==='number'){ac=r.ac;er=(typeof r.er==='number')?r.er:0;}else{ac=qs.filter(q=>ans[q]===true).length;er=qs.filter(q=>ans[q]===false).length;}return{name:r.analista,caixa:r.caixa,ac,er,stars:r.stars,total:ac+er};});
  const cx={};(t.caixas||[]).forEach(c=>cx[c]={name:c,ac:0,er:0,stars:[],n:0});
  analysts.forEach(a=>{const c=cx[a.caixa]||(cx[a.caixa]={name:a.caixa,ac:0,er:0,stars:[],n:0});c.ac+=a.ac;c.er+=a.er;if(a.stars)c.stars.push(a.stars);c.n++;});
  const caixaArr=Object.values(cx).map(c=>({...c,total:c.ac+c.er,errRate:(c.ac+c.er)?c.er/(c.ac+c.er)*100:0,avgStars:c.stars.length?c.stars.reduce((s,x)=>s+x,0)/c.stars.length:0}));
  const qErr=qs.map(q=>({q,er:res.filter(r=>(r.answers||{})[q]===false).length})).sort((a,b)=>b.er-a.er);
  return{analysts,caixaArr,qErr,res,qs};
}
function worstCaixa(arr){return [...arr].filter(c=>c.name!=='Não atribuído'&&c.er>0).sort((a,b)=>b.errRate-a.errRate)[0];}
function viewImpactoTreino(){
  if(route.teamId&&(db.individualTrainings||[]).some(x=>x.id===route.teamId))return viewIndividualDetail(route.teamId);
  if(route.teamId&&getAvalConhecimentos().some(a=>a.id===route.teamId))return viewAvalConhecimento();
  if(route.teamId)return viewTeamDetail(route.teamId);
  const teams=inMonth(db.teamTrainings);
  const cards=teams.map(t=>{const c=teamCompute(t);const totA=c.analysts.length;
    const accRate=c.analysts.reduce((s,a)=>s+a.ac,0),tot=c.analysts.reduce((s,a)=>s+a.total,0);
    const worst=worstCaixa(c.caixaArr);
    const allStars=c.res.map(r=>r.stars).filter(Boolean);const avgS=allStars.length?round(allStars.reduce((s,x)=>s+x,0)/allStars.length,1):0;
    return `<div class="folder neutral" style="position:relative"><button onclick="delTeam('${t.id}')" style="position:absolute;top:10px;right:10px;border:none;background:none;color:var(--text-3);font-size:15px;cursor:pointer;padding:2px 5px;border-radius:6px;line-height:1" title="Excluir treino">✕</button><div style="cursor:pointer" onclick="openTeam('${t.id}')"><div class="ico">★</div><h3>${esc(t.title)}</h3><div class="meta">${esc(t.date)} · ${(t.caixas||[]).length} caixas · ${totA} avaliações</div>
      <div style="display:flex;gap:8px;margin-top:9px;flex-wrap:wrap">${totA?`<span class="chip" style="color:var(--purple-dark);border-color:var(--purple-soft)">acerto ${tot?Math.round(accRate/tot*100):0}%</span>${avgS?`<span class="chip" style="color:var(--amber-text);border-color:var(--amber-soft)">${avgS}/5 ★</span>`:''}${worst?`<span class="chip" style="color:var(--red-text);border-color:var(--red-soft)">⚠ ${esc(worst.name)}</span>`:''}`:'<span class="chip" style="color:var(--amber-text);border-color:var(--amber-soft)">aguardando importação</span>'}</div></div></div>`;}).join('');
  // Cards de Avaliação de Conhecimento do mês
  const acsDoMes=getAvalConhecimentos().filter(a=>a.month===db.current);
  const acCards=acsDoMes.map(ac=>`<div class="folder neutral" style="position:relative;border-left:3px solid var(--purple);cursor:pointer" onclick="route.teamId='${ac.id}';render();window.scrollTo(0,0)">
    <div class="ico">📊</div><h3>Avaliação de Conhecimento</h3>
    <div class="meta">${esc(ac.data||'')} · ${ac.analistas.length} analistas</div>
    <div style="display:flex;gap:8px;margin-top:9px;flex-wrap:wrap">
      <span class="chip" style="color:var(--purple-dark);border-color:var(--purple-soft)">média ${Math.round(ac.analistas.reduce((s,a)=>s+a.pct_g,0)/ac.analistas.length)}%</span>
    </div>
  </div>`).join('');
  // Cards de Treinamento Individual do mês
  const indivDoMes=(db.individualTrainings||[]).filter(x=>x.month===db.current);
  const indivCards=indivDoMes.map(it=>{
    const results=it.results||[];
    return `<div class="folder neutral" style="position:relative;border-left:3px solid var(--teal)"><button onclick="delIndividualTraining('${it.id}')" style="position:absolute;top:10px;right:10px;border:none;background:none;color:var(--text-3);font-size:15px;cursor:pointer;padding:2px 5px;border-radius:6px;line-height:1" title="Excluir">✕</button><div style="cursor:pointer" onclick="route.teamId='${it.id}';route.itaId=null;render();window.scrollTo(0,0)">
    <div class="ico">🎯</div><h3>${esc(it.title)}</h3>
    <div class="meta">${results.length} analista${results.length!==1?'s':''} · ${esc(it.date||'')}</div>
    <div style="display:flex;gap:8px;margin-top:9px;flex-wrap:wrap">${indivBadges(it)}</div>
  </div></div>`;}).join('');

  return `<div class="page-h"><h1>${esc(T('impacto-treino'))}</h1><p>Treinamentos de lançamento de produto e padronização de processo. Avaliações pós-treino por analista e por caixa de atendimento.</p></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:14px;flex-wrap:wrap">
      <button class="btn primary edit-only" onclick="openImportAvalConhecimento()">+ Avaliação de conhecimento</button>
      <button class="btn primary edit-only" onclick="openTeamModal()">+ Treinamento de time</button>
      <button class="btn primary edit-only" onclick="openIndividualModal()">+ Treinamento individual</button>
    </div>
    <div class="folders">${acCards}${cards}${indivCards}</div>
    ${!teams.length&&!acsDoMes.length&&!indivDoMes.length?'<div class="empty">Nenhum treinamento neste mês.</div>':''}`;
}
function indivBadges(it){
  const results=it.results||[];
  if(!results.length)return'<span class="chip" style="color:var(--text-3);border-color:var(--border)">nenhum analista ainda</span>';
  const comProva=results.filter(r=>r.ac!=null&&r.er!=null);
  const totAc=comProva.reduce((s,r)=>s+r.ac,0),totQ=comProva.reduce((s,r)=>s+r.ac+r.er,0);
  const pctMedio=totQ?Math.round(totAc/totQ*100):null;
  const comDuasSemanas=results.filter(r=>{
    const s1=(r.semanas||[])[0],s2=(r.semanas||[])[1];
    const s1F=s1&&(s1.sla!=null||s1.csat!=null||s1.tma!=null||s1.recebidas!=null||s1.fechadas!=null);
    const s2F=s2&&(s2.sla!=null||s2.csat!=null||s2.tma!=null||s2.recebidas!=null||s2.fechadas!=null);
    return s1F&&s2F;
  }).length;
  let html='';
  html+=pctMedio!=null?`<span class="chip" style="color:var(--purple-dark);border-color:var(--purple-soft)">prova média ${pctMedio}%</span>`:'<span class="chip" style="color:var(--amber-text);border-color:var(--amber-soft)">aguardando prova</span>';
  html+=comDuasSemanas?`<span class="chip" style="color:var(--green-text);border-color:var(--green-soft)">${comDuasSemanas}/${results.length} c/ acompanhamento completo</span>`:'<span class="chip" style="color:var(--text-3);border-color:var(--border)">acompanhamento pendente</span>';
  return html;
}

function importIndividualResults(id){
  const f=document.getElementById('indivCsv').files[0];if(!f){toast('Selecione um arquivo CSV ou XLSX');return;}
  readSheetRows(f,(err,rows)=>{
    if(err){toast('Erro ao ler o arquivo: '+err.message);console.error(err);return;}
    if(!rows||rows.length<2){toast('Arquivo vazio ou sem respostas');return;}

      const parsed=parseAnswerSheet(rows);
      if(!parsed.results.length){toast('Nenhuma linha de resposta válida encontrada');return;}
      const it=(db.individualTrainings||[]).find(x=>x.id===id);if(!it)return;
      it.questions=parsed.questions;it.errMode=parsed.errMode;
      if(!it.results)it.results=[];
      let added=0,updated=0;
      parsed.results.forEach(res=>{
        let ex=it.results.find(a=>(res.email&&a.email&&a.email.toLowerCase().trim()===res.email.toLowerCase().trim())||nkey(a.analista)===nkey(res.analista));
        if(ex){
          ex.email=res.email||ex.email;ex.caixa=res.caixa||ex.caixa;
          ex.answers=res.answers;ex.ac=res.ac;ex.er=res.er;ex.stars=res.stars;ex.feedback=res.feedback;
          updated++;
        } else {
          it.results.push({id:'ita_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),analista:res.analista,email:res.email,caixa:res.caixa,answers:res.answers,ac:res.ac,er:res.er,stars:res.stars,feedback:res.feedback,obs:'',semanas:[null,null],periodo1:'',periodo2:''});
          added++;
        }
        if(res.caixa&&res.caixa!=='Não atribuído')upsertRoster(res.analista,res.email||'',res.caixa);
      });
      if(parsed.caixaDetected){
        const novas=it.results.map(x=>x.caixa).filter(c=>c&&c!=='Não atribuído');
        const seen=new Map();
        novas.forEach(c=>{const k=c.trim().toLowerCase();if(!seen.has(k))seen.set(k,c.trim());});
        it.caixas=[...seen.values()];
        seen.forEach((nome,key)=>{if(!db.caixas.find(c=>c.trim().toLowerCase()===key))db.caixas.push(nome);});
      }
      persist();render();toast(`${added} adicionado(s), ${updated} atualizado(s)`);
    }catch(err){toast('Erro ao processar o arquivo: '+err.message);console.error(err);}
  });
}

    <input type="file" accept=".csv,.xlsx,.xls" id="indivCsv" class="fld"><div style="margin-top:10px"><button class="btn primary" onclick="importIndividualResults('${it.id}')">Importar e calcular</button></div></div>`;
  const stat=(l,v,clr,sub)=>`<div class="mcard"><div class="lbl">${l}</div><div class="val" style="${clr?`color:${clr}`:''}">${v}</div>${sub?`<div class="foot">${sub}</div>`:''}</div>`;

function parseCSV(text,delim){const rows=[];let row=[],f='',i=0,q=false;const D=delim||',';while(i<text.length){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i+=2;continue;}q=false;i++;continue;}f+=c;i++;continue;}if(c==='"'){q=true;i++;continue;}if(c===D){row.push(f);f='';i++;continue;}if(c==='\r'){i++;continue;}if(c==='\n'){row.push(f);rows.push(row);row=[];f='';i++;continue;}f+=c;i++;}if(f!==''||row.length){row.push(f);rows.push(row);}return rows;}
function detectDelim(text){let i=0,q=false,comma=0,semi=0,tab=0;while(i<text.length){const c=text[i];if(c==='"'){q=!q;i++;continue;}if(!q){if(c===',')comma++;else if(c===';')semi++;else if(c==='\t')tab++;else if(c==='\n')break;}i++;}if(tab>comma&&tab>semi)return '\t';return semi>comma?';':',';}
function nameFromEmail(e){
  const l=(e||'').split('@')[0];
  // Converte partes separadas por . _ - em Nome Sobrenome capitalizado
  const parts=l.split(/[._-]+/).filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase());
  // Pega só as duas primeiras partes (nome + sobrenome) para não ficar longo
  return parts.slice(0,2).join(' ')||e;
}
function truncate(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s;}
function norm(s){return (s||'').toString().replace(/\s+/g,' ').trim().toLowerCase();}
function deaccent(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function nkey(s){return deaccent(norm(s));}
function rosterCaixa(name,email){const ek=nkey(email),nn=nkey(name);
  if(ek){const m=(db.roster||[]).find(x=>nkey(x.email)&&nkey(x.email)===ek);if(m)return m.caixa;}
  if(nn){const m=(db.roster||[]).find(x=>nkey(x.name)===nn);if(m)return m.caixa;}
  if(email){const dn=nkey(nameFromEmail(email));const m=(db.roster||[]).find(x=>nkey(x.name)===dn);if(m)return m.caixa;}
  return '';}
function upsertRoster(name,email,caixa){const ek=nkey(email),nn=nkey(name);
  let m=(db.roster||[]).find(x=>(ek&&nkey(x.email)===ek)||nkey(x.name)===nn);
  if(m){m.caixa=caixa;if(email&&!m.email)m.email=email;}else db.roster.push({name,email:email||'',caixa});}

function isCorrect(v){
  const raw=(v||'').toString().trim();
  const vv=raw.toLowerCase();
  const okSet=['✓','✔','✅','1','acerto','acertou','certo','correto','certa','correta','c','sim','true','ok'];
  const noSet=['✗','✘','✕','❌','x','0','erro','errou','errado','incorreto','errada','e','nao','não','false'];
  if(okSet.includes(raw)||okSet.includes(vv))return true;
  if(noSet.includes(raw)||noSet.includes(vv))return false;

function readSheetRows(file,callback){
  const isXlsx=/\.xlsx?$/i.test(file.name);
  const r=new FileReader();
  r.onload=()=>{
    try{
      let rows;
      if(isXlsx){
        const wb=XLSX.read(r.result,{type:'array',cellDates:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false}).filter(rw=>rw.some(c=>c!==null&&String(c).trim()!==''));
      } else {
        const text=r.result;
        rows=parseCSV(text,detectDelim(text)).filter(rw=>rw.some(c=>c&&c.trim()));
      }
      callback(null,rows);
    }catch(err){callback(err,null);}
  };
  r.onerror=()=>callback(new Error('Falha ao ler o arquivo'),null);
  if(isXlsx)r.readAsArrayBuffer(file);else r.readAsText(file,'utf-8');
}
/* Extrai nome/caixa/respostas de uma planilha de teste (CSV ou XLSX já lida como linhas).
   Reaproveitado por: treino de time, treinamento individual e avaliações do onboarding. */
function parseAnswerSheet(rows){
  if(!rows||rows.length<2)return{results:[],questions:[],errMode:'gabarito',caixaDetected:false};
  const raw=rows[0].map(h=>String(h||'').trim());
  const low=raw.map(h=>h.toLowerCase());
  const find=re=>low.findIndex(h=>re.test(h));
  const tsI=find(/carimbo|data.hora|timestamp/);
  const emailI=find(/e.?mail|endere.o de e/);
  const nameI=low.findIndex(h=>h==='nome'||h==='analista'||h==='nome do analista'||/^analista\b/.test(h));
  const caixaI=find(/caixa/);
  const scoreI=find(/pontua|^score$|^pontos$/);
  const starsI=low.findIndex(h=>
    h.includes('avalia') && (h.includes('geral')||h.includes('trein')||h.includes('forma geral')) ||
    h.includes('estrela') || h==='avaliacao' || h==='avaliação'
  );
  const isGabaritoCol=i=>low[i]&&/resposta\s+(certa|errada|certo|errado|certa ou errada)/.test(low[i]);
  const intercalado=raw.some((_,i)=>isGabaritoCol(i));
  const excl=new Set([tsI,emailI,nameI,caixaI,scoreI,starsI].filter(x=>x>=0));
  raw.forEach((_,i)=>{
    const h=low[i];
    if(!h||/^colun[ao]\s*\d+$/i.test(h)||/^pontos?$/i.test(h)) excl.add(i);
    if(h.includes('%')||h.includes('porcent')) excl.add(i);
    if(isGabaritoCol(i)) excl.add(i);
    if(h.includes('recado')||h.includes('mensagem')||h.includes('feedback')||(h.includes('deixar')&&h.includes('algum'))) excl.add(i);
  });
  let pares=[];
  if(intercalado){
    raw.forEach((_,i)=>{
      if(excl.has(i)) return;
      const next=i+1;
      if(next<raw.length && isGabaritoCol(next)){
        pares.push({qI:i,gI:next,label:raw[i]});
        excl.add(next);
      }
    });
  }
  const qIdx=raw.map((_,i)=>i).filter(i=>!excl.has(i)&&!pares.find(p=>p.qI===i));
  const results=[];
  rows.slice(1).forEach(rw=>{
    const cell=i=>String(rw[i]===null||rw[i]===undefined?'':rw[i]).trim();
    const email=emailI>=0?cell(emailI):'';
    let name=nameI>=0?cell(nameI):'';
    if(!name&&email)name=nameFromEmail(email);
    if(name&&name.includes('@'))name=nameFromEmail(name);
    if(!name) return;
    let caixa=caixaI>=0?cell(caixaI):'';
    if(!caixa) caixa=rosterCaixa(name,email);
    if(!caixa) caixa='Não atribuído';
    const answers={};
    let ac=0,er=0;
    if(intercalado && pares.length){
      pares.forEach(p=>{
        const v=isCorrect(cell(p.gI));
        answers[p.label]= v!==null ? v : true;
        if(v===true)ac++;
        else er++;
      });
      qIdx.forEach(i=>{
        const v=isCorrect(cell(i));
        if(v!==null){answers[raw[i]]=v;if(v)ac++;else er++;}
      });
    } else {
      let recognized=0,cells=0;
      rows.slice(1).forEach(rw2=>qIdx.forEach(i=>{cells++;if(isCorrect(String(rw2[i]||'').trim())!==null)recognized++;}));
      const formatA=cells>0&&recognized/cells>0.5;
      if(formatA){
        qIdx.forEach(i=>{const v=isCorrect(cell(i));if(v!==null){answers[raw[i]]=v;if(v)ac++;else er++;}});
      } else {
        const modes={};
        qIdx.forEach(i=>{const cc={};rows.slice(1).forEach(rw2=>{const v=norm(String(rw2[i]||''));if(v)cc[v]=(cc[v]||0)+1;});let best='',bn=-1;for(const k in cc){if(cc[k]>bn){bn=cc[k];best=k;}}modes[i]=best;});
        qIdx.forEach(i=>{const v=norm(cell(i));const ok=v===modes[i]&&v!=='';answers[raw[i]]=ok;if(ok)ac++;else er++;});
      }
    }
    if(scoreI>=0){
      const sv=cell(scoreI).replace(',','.');
      const mm=sv.match(/([\d.]+)\s*\/\s*([\d.]+)/);
      if(mm){ac=parseFloat(mm[1]);er=Math.max(0,parseFloat(mm[2])-ac);}
      else{const n=parseFloat(sv);if(!isNaN(n)){ac=n;er=0;}}
    }
    let stars=0;
    if(starsI>=0){const s=parseFloat(cell(starsI).replace(',','.'));if(!isNaN(s))stars=Math.max(0,Math.min(5,s));}
    let feedback='';
    const fbIdx=low.findIndex(h=>h.includes('recado')||h.includes('mensagem')||h.includes('feedback')||h.includes('deixar'));
    if(fbIdx>=0){const fv=String(rw[fbIdx]===null||rw[fbIdx]===undefined?'':rw[fbIdx]).trim();if(fv)feedback=fv;}
    results.push({analista:name,email,caixa,answers,stars,ac,er,feedback});
  });
  const questions=intercalado?pares.map(p=>p.label):qIdx.map(i=>raw[i]);
  const errMode=intercalado?'gabarito':(qIdx.length?'estimado':'gabarito');
  return{results,questions,errMode,caixaDetected:caixaI>=0};
}
function importTeamResults(id){
  const f=document.getElementById('teamCsv').files[0];if(!f){toast('Selecione um arquivo CSV ou XLSX');return;}
  readSheetRows(f,(err,rows)=>{
    if(err){toast('Erro ao ler o arquivo: '+err.message);console.error(err);return;}
    if(!rows||rows.length<2){toast('Arquivo vazio ou sem respostas');return;}
    try{
      const parsed=parseAnswerSheet(rows);
      if(!parsed.results.length){toast('Nenhuma linha de resposta válida encontrada');return;}
      const t=db.teamTrainings.find(x=>x.id===id);
      t.results=parsed.results;
      t.questions=parsed.questions;
      t.errMode=parsed.errMode;
      if(parsed.caixaDetected){
        const novas=parsed.results.map(x=>x.caixa).filter(c=>c&&c!=='Não atribuído');
        const seen=new Map();
        novas.forEach(c=>{const k=c.trim().toLowerCase();if(!seen.has(k))seen.set(k,c.trim());});
        t.caixas=[...seen.values()];
        seen.forEach((nome,key)=>{
          const existe=db.caixas.find(c=>c.trim().toLowerCase()===key);
          if(!existe)db.caixas.push(nome);
        });
      }
      parsed.results.forEach(res=>{if(res.caixa&&res.caixa!=='Não atribuído')upsertRoster(res.analista,res.email||'',res.caixa);});
      persist();render();toast(parsed.results.length+' respostas importadas com sucesso');
    }catch(err){toast('Erro ao processar o arquivo: '+err.message);console.error(err);}
  });
}
function setResultCaixa(id,i,caixa){const t=db.teamTrainings.find(x=>x.id===id);if(t&&t.results&&t.results[i]){const r=t.results[i];r.caixa=caixa;if(caixa&&caixa!=='Não atribuído')upsertRoster(r.analista,r.email||'',caixa);persist();render();}}
function downloadTeamTemplate(id){
  const t=db.teamTrainings.find(x=>x.id===id);const qs=(t.questions&&t.questions.length)?t.questions:['Pergunta 1','Pergunta 2','Pergunta 3'];
  const head=['analista','caixa','avaliacao',...qs];
  const ex=['Maria Silva',(t.caixas&&t.caixas[0])||'Silver','5',...qs.map((_,i)=>i%2?'erro':'acerto')];
  const csv=[head,ex].map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  dl(csv,`modelo-${t.title.slice(0,20).replace(/\W+/g,'-')}.csv`);
}

const TRIMESTRES=[
  {label:'Q1',meses:['Janeiro','Fevereiro','Março']},
  {label:'Q2',meses:['Abril','Maio','Junho']},
  {label:'Q3',meses:['Julho','Agosto','Setembro']},
  {label:'Q4',meses:['Outubro','Novembro','Dezembro']},
];

function getCurrentTrimestre(){
  const d=new Date();
  const q=Math.floor(d.getMonth()/3);
  return{qi:q,ano:d.getFullYear()};
}

function viewTrimestre(){
  if(!db._triAno)db._triAno=getCurrentTrimestre().ano;
  if(db._triQ==null)db._triQ=getCurrentTrimestre().qi;
  const qi=db._triQ, ano=db._triAno;
  const tri=TRIMESTRES[qi];
  const mesesDoTri=tri.meses.map(m=>m+' '+ano);

  // Helper: filtrar itens dos 3 meses
  function inTri(arr){return(arr||[]).filter(x=>mesesDoTri.includes(x.month));}

  const allActions=inTri(db.actions);
  const allDocs=inTri(db.docs);
  const allPdis=inTri(db.pdis);
  const allMacros=inTri(db.macros);
  const allTeams=(db.teamTrainings||[]).filter(t=>mesesDoTri.includes(t.month));
  const items=[...allActions,...allDocs,...allPdis];

  const total=items.length;
  const concl=items.filter(x=>x.status==='Concluído'||x.status==='Material pronto').length;
  const pend=items.filter(x=>x.status==='Pendente').length;
  const pausados=items.filter(x=>x.status==='Pausado').length;
  const migrados=items.filter(x=>x.status==='Migrado').length;
  const andamento=total-concl-pend-pausados-migrados;

  // PDIs
  const donePdis=allPdis.filter(p=>p.hasResults);
  const melhora=donePdis.length?round(donePdis.reduce((s,p)=>s+pdiOverall(p),0)/donePdis.length,1):0;

  // Treinamentos
  const tResults=allTeams.flatMap(t=>(t.results||[]));
  const tAc=tResults.reduce((s,r)=>s+(typeof r.ac==='number'?r.ac:0),0);
  const tTot=tResults.reduce((s,r)=>s+(typeof r.ac==='number'?r.ac+(typeof r.er==='number'?r.er:0):0),0);
  const treinoPct=tTot?Math.round(tAc/tTot*100):null;
  const tStars=tResults.map(r=>r.stars).filter(Boolean);
  const avgStars=tStars.length?round(tStars.reduce((s,x)=>s+x,0)/tStars.length,1):null;

  // Avaliação de conhecimento (se estiver no trimestre)
  const acsTri=getAvalConhecimentos().filter(a=>a.analistas&&a.analistas.length&&mesesDoTri.includes(a.month));
  const acMesOk=acsTri.length>0;
  const acPct=acMesOk?Math.round(acsTri.flatMap(x=>x.analistas).reduce((s,a)=>s+a.pct_g,0)/acsTri.flatMap(x=>x.analistas).length):null;
  const mediaAcertoVals=[treinoPct,acPct].filter(v=>v!==null);
  const mediaAcerto=mediaAcertoVals.length?Math.round(mediaAcertoVals.reduce((s,v)=>s+v,0)/mediaAcertoVals.length):null;


  // Seletor
  const anos=[];for(let y=2025;y<=new Date().getFullYear()+1;y++)anos.push(y);
  const selHTML=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap">
    <label style="font-size:.85em;font-weight:600;color:var(--text-2)">Trimestre:</label>
    <select style="border:1px solid var(--border-2);background:var(--surface);border-radius:9px;padding:8px 14px;font-size:.95em;color:var(--text);font-weight:500" onchange="db._triQ=parseInt(this.value);render()">
      ${TRIMESTRES.map((t,i)=>`<option value="${i}" ${i===qi?'selected':''}>${t.label} — ${t.meses[0].slice(0,3)}/${t.meses[1].slice(0,3)}/${t.meses[2].slice(0,3)}</option>`).join('')}
    </select>
    <select style="border:1px solid var(--border-2);background:var(--surface);border-radius:9px;padding:8px 14px;font-size:.95em;color:var(--text);font-weight:500" onchange="db._triAno=parseInt(this.value);render()">
      ${anos.map(y=>`<option ${y===ano?'selected':''}>${y}</option>`).join('')}
    </select>
    <span style="font-size:.82em;color:var(--text-3)">${tri.meses.join(', ')} ${ano}</span>
  </div>`;

  // Cards
  const cards=`<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px">
    <div class="mcard"><div class="lbl">Ações programadas</div><div class="val">${total}</div><div class="foot">${tri.label} ${ano}</div></div>
    <div class="mcard"><div class="lbl">Ações concluídas</div><div class="val">${concl}</div><span class="tag" style="background:var(--green-soft);color:var(--green-text)">${total?Math.round(concl/total*100):0}%</span></div>
    <div class="mcard"><div class="lbl">Macros & Taxonomias</div><div class="val">${allMacros.length}</div></div>
    <div class="mcard"><div class="lbl">Melhora média PDIs</div><div class="val">${melhora?'+'+melhora+'%':'—'}</div><div class="foot">${donePdis.length} PDI${donePdis.length!==1?'s':''}</div></div>
    <div class="mcard"><div class="lbl">Rampagem New Hire<span class="lbl-ic">🚀</span></div>
      ${(()=>{
        // Consolida a rampagem de TODOS os new hires de TODOS os meses do trimestre
        const rampagensMeses = mesesDoTri.map(mes => calcularRampagem(db.acompanhamento, mes)).filter(r => r !== null);
        if(!rampagensMeses.length)return'<div class="val" style="color:var(--text-3)">—</div>';
        const totalAnalistas = rampagensMeses.reduce((s, r) => s + r.count, 0);
        const somaPercentuais = rampagensMeses.reduce((s, r) => s + (r.pct * r.count), 0);
        const pctConsolidado = totalAnalistas ? Math.round(somaPercentuais / totalAnalistas) : 0;
        const status = pctConsolidado >= 70 ? 'Sucesso' : (pctConsolidado >= 50 ? 'Acompanhar' : 'Atenção');
        return rampCardHTML(pctConsolidado,status,totalAnalistas);
      })()}
    </div>
    <div class="mcard"><div class="lbl">Média Treinamentos<span class="lbl-ic">★</span></div>
      ${mediaAcerto!==null?`<div class="val" style="color:${mediaAcerto>=60?'var(--green)':'var(--red-text)'}">${mediaAcerto}%</div>`:'<div class="val" style="color:var(--text-3)">—</div>'}
      ${avgStars?`<span class="tag" style="background:rgba(245,158,11,.15);color:var(--amber)">${avgStars}/5 ★</span>`:`<span class="tag" style="background:var(--input-bg);color:var(--text-3)">—</span>`}
    </div>
  </div>`;

  // Ações por tipo — subtipos de treinamento
  const byTypeTri={};
  allActions.forEach(a=>byTypeTri[a.type||'Treinamento de time']=(byTypeTri[a.type||'Treinamento de time']||0)+1);
  allDocs.forEach(()=>byTypeTri['Documentação']=(byTypeTri['Documentação']||0)+1);
  allPdis.forEach(()=>byTypeTri['PDI']=(byTypeTri['PDI']||0)+1);
  allMacros.forEach(()=>byTypeTri['Macros & Taxonomias']=(byTypeTri['Macros & Taxonomias']||0)+1);
  const orderTri=['PDI','Treinamento individual','Imersão Suporte','Treinamento de time','Onboarding','Documentação','Macros & Taxonomias'];
  const rowsTri=orderTri.filter(t=>byTypeTri[t]).map(t=>({t,n:byTypeTri[t]}));
  const tipoMaxTri=Math.max(1,...rowsTri.map(r=>r.n));
  const tipoBars=rowsTri.map(r=>{
    const pct=total?Math.round(r.n/total*100):0;
    const barColor=(TYPES[r.t]||{}).bar||(r.t==='Macros & Taxonomias'?'#f59e0b':'#999');
    const w=Math.max(r.n/tipoMaxTri*100,pct?14:0);
    return`<div class="barrow"><div class="nm">${esc(r.t)}</div><div class="track" style="position:relative"><div class="fill" style="width:${w}%;background:${barColor}"><span style="position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.72em;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)">${r.n} (${pct}%)</span></div></div></div>`;
  }).join('');
  const tipoHTML=`<div class="panel"><div class="panel-h"><div class="pi">▦</div><h2>Ações por tipo — ${tri.label} ${ano}</h2></div>${tipoBars||'<div class="empty">Sem ações</div>'}</div>`;

  // Resumo por mês
  const resumoMes=mesesDoTri.map(mes=>{
    const mAct=(db.actions||[]).filter(x=>x.month===mes);
    const mDoc=(db.docs||[]).filter(x=>x.month===mes);
    const mPdi=(db.pdis||[]).filter(x=>x.month===mes);
    const mMacro=(db.macros||[]).filter(x=>x.month===mes);
    const mAll=[...mAct,...mDoc,...mPdi];
    const mTotal=mAll.length;
    const mConcl=mAll.filter(x=>x.status==='Concluído'||x.status==='Material pronto').length;
    const pct=mTotal?Math.round(mConcl/mTotal*100):0;
    const mesNome=mes.split(' ')[0];
    return`<div class="c"><h3>${esc(mesNome)}</h3>
      <p style="font-size:1.6em;font-weight:800;font-family:'Inter',sans-serif;color:${pct>=60?'var(--green)':pct>0?'var(--amber)':'var(--text-3)'};margin:6px 0 4px">${pct}%</p>
      <div class="st">${mTotal} ações · ${mConcl} concl.</div>
      <div class="st" style="margin-top:3px">${mAct.length} treinos · ${mDoc.length} docs · ${mPdi.length} PDIs · ${mMacro.length} macros</div>
    </div>`;
  }).join('');

  // Top 3 melhores + Top 3 atenção
  const anRank={};
  const acsTri5=getAvalConhecimentos().filter(a=>a.analistas&&a.analistas.length&&mesesDoTri.includes(a.month));
  acsTri5.forEach(ac=>ac.analistas.forEach(a=>{
    if(!anRank[a.nome])anRank[a.nome]={nome:a.nome,caixa:a.caixa||'',scores:[],count:0};
    anRank[a.nome].scores.push(a.pct_g);anRank[a.nome].count++;
  }));
  const allTeamsTri=(db.teamTrainings||[]).filter(t=>mesesDoTri.includes(t.month));
  allTeamsTri.forEach(t=>(t.results||[]).forEach(r=>{
    if(!r.analista)return;
    const tot=(typeof r.ac==='number'?r.ac:0)+(typeof r.er==='number'?r.er:0);
    if(!tot)return;
    const pctR=Math.round((r.ac||0)/tot*100);
    if(!anRank[r.analista])anRank[r.analista]={nome:r.analista,caixa:r.caixa||'',scores:[],count:0};
    anRank[r.analista].scores.push(pctR);anRank[r.analista].count++;
  }));
  const allRanked=Object.values(anRank).map(a=>({...a,avg:Math.round(a.scores.reduce((s,v)=>s+v,0)/a.scores.length)}));
  const top3=allRanked.sort((a,b)=>b.avg-a.avg).slice(0,3);
  const bot3=allRanked.sort((a,b)=>a.avg-b.avg).slice(0,3);
  function rankRow(a,i,isTop){
    const medal=isTop?(i===0?'🥇':i===1?'🥈':i===2?'🥉':''):'';
    return`<tr><td style="font-weight:600">${medal} ${i+1}º</td><td><b>${esc(a.nome)}</b><div style="font-size:.72em;color:var(--text-3)">${esc(a.caixa)}</div></td><td style="font-weight:700;color:${a.avg>=60?'var(--green)':'var(--red-text)'}">${a.avg}%</td></tr>`;
  }
  const topHTML=allRanked.length?`<div class="grid2">
    <div class="panel"><div class="panel-h"><div class="pi">🏆</div><h2>Top 3 melhores — ${tri.label} ${ano}</h2></div>
      <div class="wrap-x"><table class="tbl"><thead><tr><th>#</th><th>Analista</th><th>Média</th></tr></thead><tbody>${top3.map((a,i)=>rankRow(a,i,true)).join('')}</tbody></table></div></div>
    <div class="panel"><div class="panel-h"><div class="pi">⚠</div><h2>Top 3 atenção — ${tri.label} ${ano}</h2></div>
      <div class="wrap-x"><table class="tbl"><thead><tr><th>#</th><th>Analista</th><th>Média</th></tr></thead><tbody>${bot3.map((a,i)=>rankRow(a,i,false)).join('')}</tbody></table></div></div>
  </div>`:''

  // Rampagem — calcular evolução trimestral (S1 → S3)
  
  // Comparativo com trimestre anterior
  const prevQi=qi===0?3:qi-1;
  const prevAno2=qi===0?ano-1:ano;
  const prevTri=TRIMESTRES[prevQi];
  const prevMeses=prevTri.meses.map(m=>m+' '+prevAno2);
  
  const prevAcompArr=(db.acompanhamento||[]).filter(a=>{
    const p=a.periodo1||a.month||'';
    const mt2=p.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(mt2){
      const _mN2=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
      const mesPrev=_mN2[parseInt(mt2[2])-1]+' '+mt2[3];
      return prevMeses.includes(mesPrev);
    }
    return false;
  });
  
  const prevItems=[...(db.actions||[]).filter(x=>prevMeses.includes(x.month)),...(db.docs||[]).filter(x=>prevMeses.includes(x.month)),...(db.pdis||[]).filter(x=>prevMeses.includes(x.month))];
  const prevTotal=prevItems.length;
  const prevConcl=prevItems.filter(x=>x.status==='Concluído'||x.status==='Material pronto').length;
  const prevPctC=prevTotal?Math.round(prevConcl/prevTotal*100):0;
  
  const curPctC=total?Math.round(concl/total*100):0;
  const prevMacrosN=(db.macros||[]).filter(m=>prevMeses.includes(m.month)).length;
  function compC(label,cur,prev,suffix){
    const sf=suffix||'';
    const d=cur-prev;
    return`<div style="text-align:center"><div style="font-size:.7em;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">${label}</div>
      <div style="font-size:1.3em;font-weight:800;color:${d>0?'var(--green)':d<0?'var(--red-text)':'var(--text-3)'}">${d>0?'↑ +':d<0?'↓ ':''}${d!==0?Math.abs(d):'='}${sf}</div>
      <div style="font-size:.68em;color:var(--text-3)">${cur}${sf} vs ${prev}${sf}</div></div>`;
  }
  const compHTML=`<div class="panel" style="padding:18px"><div class="panel-h" style="margin-bottom:14px"><div class="pi">↕</div><h2>Comparativo vs ${prevTri.label} ${prevAno2}</h2></div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
      ${compC('% Conclusão',curPctC,prevPctC,'%')}
      ${compC('Concluídas',concl,prevConcl)}
      ${compC('Total ações',total,prevTotal)}
      ${compC('Macros & Tax.',allMacros.length,prevMacrosN)}
    </div></div>`;
  
  // Card de Rampagem Trimestral com 5 métricas
  
  return `<div class="page-h"><h1>◆ ${esc(T('trimestre'))}</h1><p>Visão consolidada do trimestre — ações, PDIs, treinamentos e rampagem agregados.</p></div>
  ${selHTML}${cards}
  <div class="grid2">
    ${tipoHTML}
    <div class="panel"><div class="panel-h"><div class="pi">📅</div><h2>Resumo por mês</h2></div>
      <div class="msum">${resumoMes}</div>
    </div>
  </div>
  ${topHTML}
  ${compHTML}`;
}

/* --- helpers de período --- */
function currentBimestreKey(){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth();
  return y+'-'+(m<6?'01':'07');
}
function bimestreLabel(k){
  if(!k)return '';
  const [y,ms]=k.split('-'),s=parseInt(ms);
  const M=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return M[s-1]+' – '+M[s+4]+' '+y;
}
function bimestreKeys(){
  const keys=[],n=new Date();
  for(let y=2025;y<=n.getFullYear()+1;y++){keys.push(y+'-01');keys.push(y+'-07');}
  const limit=n.getFullYear()+'-'+(n.getMonth()<6?'01':'07');
  return keys.filter(k=>k>='2025-07'&&k<=limit);
}
function inBimestre(dateStr,key){
  if(!dateStr||!key)return false;
  try{
    const d=new Date(dateStr);
    if(isNaN(d))return false;
    const [y,ms]=key.split('-'),s=parseInt(ms);
    // s=1 → meses 0-5 (jan-jun) | s=7 → meses 6-11 (jul-dez)
    return d.getFullYear()===parseInt(y)&&d.getMonth()>=(s-1)&&d.getMonth()<=(s+4);
  }catch(e){return false;}
}
function onboardingInBimestre(){
  const b=db.onboardingBimestre||'2025-07';
  return (db.onboardingFeedbacks||[]).filter(f=>inBimestre(f.date,b));
}
